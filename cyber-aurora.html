<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="description" content="赛博极光 · 声音交互流光画布 —— 零依赖单文件实现：深空星野上的极光幕帘，响应麦克风、内置音景与触控涟漪。">
<title>赛博极光 · 声音交互流光画布</title>
<style>
  :root{
    --glass: rgba(12,17,38,.58);
    --glass-brd: rgba(255,255,255,.12);
    --chip: rgba(255,255,255,.07);
    --text: #e9f1ff;
    --muted: rgba(233,241,255,.62);
    --accent: #7dfccd;
    --shadow: 0 16px 48px rgba(0,0,0,.45);
  }
  body.light{
    --glass: rgba(244,247,255,.80);
    --glass-brd: rgba(16,24,40,.13);
    --chip: rgba(16,24,40,.06);
    --text: #131b2e;
    --muted: rgba(19,27,46,.62);
    --shadow: 0 16px 40px rgba(16,24,40,.16);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; overflow:hidden; background:#03040c; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased; transition:color .35s ease;
  }
  #scene{ position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }
  ::selection{ background:rgba(125,252,205,.35); }

  .hud{ position:fixed; left:0; right:0; z-index:10; transition:opacity .45s ease, transform .45s ease; }
  #topbar{ top:0; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; pointer-events:none; }
  #topbar > *{ pointer-events:auto; }
  #dock{
    left:50%; right:auto; bottom:0; transform:translateX(-50%);
    width:min(920px, calc(100% - 24px));
    display:flex; flex-direction:column; gap:11px; align-items:stretch;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:var(--glass); border:1px solid var(--glass-brd); border-radius:20px;
    box-shadow:var(--shadow); backdrop-filter:blur(16px) saturate(1.25);
    -webkit-backdrop-filter:blur(16px) saturate(1.25);
    pointer-events:none;
  }
  #dock > *{ pointer-events:auto; }

  .brand{ display:flex; align-items:center; gap:12px; }
  .logo{
    width:42px; height:42px; border-radius:13px; display:grid; place-items:center; flex:none;
    background:linear-gradient(140deg, rgba(125,252,205,.18), rgba(150,120,255,.16));
    border:1px solid var(--glass-brd); box-shadow:inset 0 0 18px rgba(125,252,205,.14);
    color:var(--accent);
  }
  .brand h1{ margin:0; font-size:17px; font-weight:650; letter-spacing:.05em; }
  .brand h1 .en{ font-size:10px; letter-spacing:.3em; color:var(--muted); font-weight:600; margin-left:7px; vertical-align:2px; }
  .brand p{ margin:3px 0 0; font-size:11.5px; color:var(--muted); letter-spacing:.02em; }

  .pill{
    display:flex; align-items:center; gap:10px; padding:8px 14px; border-radius:999px;
    background:var(--glass); border:1px solid var(--glass-brd);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    font-size:12px; color:var(--muted); box-shadow:var(--shadow); white-space:nowrap;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:#9aa7c4; flex:none; transition:background .3s; }
  .dot.demo{ background:var(--accent); box-shadow:0 0 10px var(--accent); animation:pulse 1.6s ease-in-out infinite; }
  .dot.mic{ background:#ff6b81; box-shadow:0 0 10px #ff6b81; animation:pulse 1.1s ease-in-out infinite; }
  .dot.paused{ background:#f4b860; animation:none; }
  @keyframes pulse{ 50%{ opacity:.35; } }
  .vu{ display:inline-flex; align-items:flex-end; gap:2px; height:14px; }
  .vu i{ width:3px; height:100%; background:var(--accent); border-radius:2px; transform-origin:bottom; transform:scaleY(.15); transition:transform .09s linear; opacity:.9; }
  .sep{ width:1px; height:14px; background:var(--glass-brd); flex:none; }
  .fps{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; font-variant-numeric:tabular-nums; }

  .dock-row{ display:flex; align-items:center; gap:12px; width:100%; justify-content:center; flex-wrap:wrap; }
  .row-label{ font-size:11px; letter-spacing:.2em; color:var(--muted); min-width:36px; text-align:right; flex:none; }
  .seg{ display:flex; background:var(--chip); border:1px solid var(--glass-brd); border-radius:12px; padding:3px; gap:3px; }
  .seg-btn{
    display:inline-flex; align-items:center; gap:6px; border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:12.5px; padding:7px 14px; border-radius:9px; cursor:pointer; transition:background .25s,color .25s;
  }
  .seg-btn:hover{ color:var(--text); }
  .seg-btn.active{ background:rgba(125,252,205,.16); color:var(--text);
    background:color-mix(in srgb, var(--accent) 20%, transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .seg-btn.active{ box-shadow:inset 0 0 0 1px rgba(125,252,205,.45); }

  .swatches{ display:flex; gap:10px; align-items:center; }
  .sw{
    --c1:#7dfccd; --c2:#59c2ff; --c3:#b48cff;
    width:52px; height:32px; border-radius:10px; border:1px solid var(--glass-brd); cursor:pointer;
    background:linear-gradient(130deg, var(--c1), var(--c2) 55%, var(--c3));
    box-shadow:inset 0 0 12px rgba(255,255,255,.10); transition:transform .25s, outline-color .25s;
    outline:2px solid transparent; outline-offset:2px; padding:0;
  }
  .sw:hover{ transform:translateY(-2px); }
  .sw.active{ outline-color:var(--accent); transform:translateY(-2px); }
  #palName{ font-size:11.5px; color:var(--muted); letter-spacing:.08em; margin-left:4px; }

  .sliders{ gap:18px; }
  .ctl{ display:flex; align-items:center; gap:10px; flex:1; min-width:150px; max-width:250px; }
  .ctl label{ font-size:12px; color:var(--muted); letter-spacing:.12em; flex:none; }
  .ctl input[type=range]{ flex:1; accent-color:var(--accent); cursor:pointer; min-width:60px; }
  .ctl .val{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); min-width:26px; text-align:right; font-variant-numeric:tabular-nums; }

  .actions{ justify-content:space-between; }
  .toggles{ display:flex; align-items:center; gap:14px; }
  .switch{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); cursor:pointer; user-select:none; }
  .switch input{
    appearance:none; -webkit-appearance:none; margin:0; width:34px; height:19px; border-radius:999px;
    background:var(--chip); border:1px solid var(--glass-brd); position:relative; cursor:pointer; transition:background .25s,border-color .25s;
  }
  .switch input::after{
    content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%;
    background:var(--muted); transition:left .25s ease, background .25s;
  }
  .switch input:checked{ background:rgba(125,252,205,.30); border-color:rgba(125,252,205,.55); }
  .switch input:checked::after{ left:17px; background:var(--accent); }
  .btns{ display:flex; gap:8px; }
  .ibtn{
    width:36px; height:36px; border-radius:11px; display:grid; place-items:center; padding:0;
    background:var(--chip); border:1px solid var(--glass-brd); color:var(--muted); cursor:pointer;
    transition:color .25s, border-color .25s, transform .25s;
  }
  .ibtn:hover{ color:var(--text); border-color:rgba(125,252,205,.5); transform:translateY(-1px); }
  .ic{ display:block; }
  #btnTheme .sun{ display:none; }
  body.light #btnTheme .sun{ display:block; }
  body.light #btnTheme .moon{ display:none; }
  #btnPause .play{ display:none; }
  body.paused #btnPause .pause{ display:none; }
  body.paused #btnPause .play{ display:block; }

  .hint{ margin:2px 0 0; font-size:10.5px; color:var(--muted); letter-spacing:.06em; text-align:center; opacity:.85; }

  #peek{
    position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:11;
    width:40px; height:40px; border-radius:12px; display:grid; place-items:center; padding:0;
    background:var(--glass); border:1px solid var(--glass-brd); color:var(--muted); cursor:pointer;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    box-shadow:var(--shadow); opacity:.55; transition:opacity .3s, color .3s;
  }
  #peek:hover{ opacity:1; color:var(--text); }
  body:not(.zen) #peek{ opacity:0; pointer-events:none; }

  body.zen .hud{ opacity:0; pointer-events:none; }
  body.zen #topbar{ transform:translateY(-130%); }
  body.zen #dock{ transform:translateX(-50%) translateY(130%); }

  #toasts{
    position:fixed; top:76px; left:50%; transform:translateX(-50%); z-index:20;
    display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:max-content; max-width:92vw;
  }
  .toast{
    padding:9px 16px; border-radius:999px; background:var(--glass); border:1px solid var(--glass-brd);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    color:var(--text); font-size:12.5px; box-shadow:var(--shadow);
    opacity:0; transform:translateY(-8px); transition:opacity .35s, transform .35s;
    max-width:92vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:none; }

  .nojs{ position:fixed; inset:0; z-index:99; display:grid; place-items:center; background:#05070f; color:#eaf2ff; font-size:14px; text-align:center; padding:24px; }

  @media (max-width:760px){
    .brand p, .brand .en{ display:none; }
    .row-label{ display:none; }
    .hint{ display:none; }
    #topbar{ padding:12px 14px; }
    .dock-row{ gap:8px; }
    .sliders{ flex-direction:column; align-items:stretch; }
    .ctl{ max-width:none; }
    .actions{ justify-content:center; }
    .pill #fps{ display:none; }
  }
  @media (max-height:600px){
    #dock{ gap:6px; }
    .hint{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    .hud, .toast, .sw, .ibtn{ transition:none; }
    .dot{ animation:none; }
  }
</style>
</head>
<body>

<canvas id="scene" role="img" aria-label="声音交互极光画布：深空星野上流动的极光幕帘，可通过声音与触控改变形态"></canvas>

<header class="hud" id="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 15.5c2.6-5.4 4.6-5.4 7-1.6s4.3 3.8 6.8-1.4 3.4-4 5.2-4.8"/>
        <path d="M2.5 19.5c2.6-3.6 4.6-3.6 7-.9s4.3 2.4 6.8-.8 3.4-2.6 5.2-3.2" opacity=".55"/>
        <path d="M4 7.5l1.2-2.4M9 6.6l.6-2.6M14.5 7l-.3-2.7" opacity=".45"/>
      </svg>
    </div>
    <div class="brand-txt">
      <h1>赛博极光<span class="en">CYBER AURORA</span></h1>
      <p>声音交互流光画布 · Web Audio × Canvas 2D · 零依赖</p>
    </div>
  </div>
  <div class="pill" id="pill">
    <span class="dot" id="modeDot" aria-hidden="true"></span>
    <span id="modeText">静默 · 呼吸态</span>
    <span class="vu" id="vu" aria-hidden="true" aria-label="实时声能电平"><i></i><i></i><i></i><i></i></span>
    <span class="sep" aria-hidden="true"></span>
    <span id="fps" class="fps">-- FPS</span>
  </div>
</header>

<button id="peek" aria-label="显示控制面板" title="显示控制面板 (H)">
  <svg class="ic" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
  </svg>
</button>

<footer class="hud" id="dock" aria-label="控制面板">
  <div class="dock-row" role="group" aria-label="声音来源">
    <span class="row-label">声源</span>
    <div class="seg" id="segModes">
      <button class="seg-btn" data-mode="silent" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="none" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        静默
      </button>
      <button class="seg-btn" data-mode="demo" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/></svg>
        音景
      </button>
      <button class="seg-btn" data-mode="mic" aria-pressed="false">
        <svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        麦克风
      </button>
    </div>
  </div>

  <div class="dock-row" role="group" aria-label="极光配色">
    <span class="row-label">配色</span>
    <div class="swatches" id="swatches"></div>
    <span id="palName">极夜苍绿</span>
  </div>

  <div class="dock-row sliders">
    <div class="ctl">
      <label for="rgSpeed">流速</label>
      <input type="range" id="rgSpeed" min="0" max="100" step="1" value="60" aria-label="极光流速">
      <span class="val" id="vSpeed">60</span>
    </div>
    <div class="ctl">
      <label for="rgIntensity">光强</label>
      <input type="range" id="rgIntensity" min="0" max="100" step="1" value="70" aria-label="极光强度">
      <span class="val" id="vIntensity">70</span>
    </div>
    <div class="ctl">
      <label for="rgStars">星辰</label>
      <input type="range" id="rgStars" min="0" max="100" step="1" value="60" aria-label="星空密度">
      <span class="val" id="vStars">60</span>
    </div>
  </div>

  <div class="dock-row actions">
    <div class="toggles">
      <label class="switch">
        <input type="checkbox" id="ckMeteors" checked>
        <span>流星</span>
      </label>
    </div>
    <div class="btns">
      <button id="btnPause" class="ibtn" aria-label="暂停 / 播放动画" title="暂停 / 播放 (Space)">
        <svg class="ic pause" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none" aria-hidden="true"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>
        <svg class="ic play" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5.4v13.2L19 12z"/></svg>
      </button>
      <button id="btnShot" class="ibtn" aria-label="保存画面" title="保存画面 (S)">
        <svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2.5"/><path d="M9 8l1.5-2.5h3L15 8"/><circle cx="12" cy="14" r="3.2"/></svg>
      </button>
      <button id="btnTheme" class="ibtn" aria-label="切换明暗主题" title="切换明暗主题 (T)">
        <svg class="ic sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
        <svg class="ic moon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="btnZen" class="ibtn" aria-label="进入纯净模式（隐藏面板）" title="纯净模式 (H)">
        <svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
      </button>
    </div>
  </div>

  <p class="hint">Space 暂停 · M 切换声源 · 1~4 切换配色 · S 保存画面 · T 主题 · H 纯净模式　|　点击画面，激起一道光浪</p>
</footer>

<div id="toasts" aria-live="polite"></div>

<noscript><div class="nojs">本页面需要启用 JavaScript 才能渲染极光画布。</div></noscript>

<script>
'use strict';
/* =====================================================================
   赛博极光 · 声音交互流光画布  (Cyber Aurora — Sound-Interactive Canvas)
   零外部依赖 · 单文件自包含 · 原生 Canvas 2D + Web Audio API
   架构：Palette 配色系统 / FBM 波场 / AudioEngine 三态声源 / HUD 控制台
   ===================================================================== */

/* ---------- 0. 基础工具（纯函数，无副作用） ---------- */
const $  = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const TAU = Math.PI * 2;

function num(v, fallback) {
  const n = +v;
  return Number.isFinite(n) ? n : fallback;
}
function hexA(hex, a) {
  const h = String(hex).replace('#', '');
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
/* 确定性轻量 FBM 波场：三层正弦叠加，归一化到 [-1, 1] */
function fbm(x, t, seed) {
  return (
    Math.sin(x * 0.006 + t * 0.42 + seed) +
    0.5 * Math.sin(x * 0.013 - t * 0.60 + seed * 1.7) +
    0.25 * Math.sin(x * 0.027 + t * 1.05 + seed * 2.3)
  ) / 1.75;
}

/* ---------- 1. 配色系统（4 套极光方案，含明暗双天空） ---------- */
const PALETTES = [
  {
    id: 'jade', name: '极夜苍绿', ui: '#7dfccd', horizon: 'rgba(70,230,180,0.10)',
    sky:  ['#010208', '#040b22', '#0a1436'],
    skyL: ['#0b0f30', '#141c4a', '#1d2a66'],
    mountain:  ['#04070f', '#0a1226'],
    mountainL: ['#0e1533', '#182052'],
    layers: [
      { baseY: .30, ampF: 1.00, hF: .20, freq: 1.00, spd: .55, seed: 1.7, top: 'rgba(10,40,45,0)',  mid: 'rgba(24,170,130,.16)',  crest: '#9dffd6' },
      { baseY: .38, ampF: 1.15, hF: .26, freq: 0.80, spd: .42, seed: 4.2, top: 'rgba(8,36,50,0)',   mid: 'rgba(18,150,150,.15)',  crest: '#6dffd0' },
      { baseY: .47, ampF: 0.85, hF: .30, freq: 1.30, spd: .70, seed: 2.9, top: 'rgba(12,30,60,0)',  mid: 'rgba(40,120,200,.13)',  crest: '#8fd8ff' },
      { baseY: .56, ampF: 1.05, hF: .34, freq: 0.65, spd: .34, seed: 5.6, top: 'rgba(20,20,60,0)',  mid: 'rgba(110,70,200,.12)',  crest: '#c7a3ff' }
    ]
  },
  {
    id: 'neon', name: '霓虹紫粉', ui: '#ff7ad9', horizon: 'rgba(255,110,220,0.10)',
    sky:  ['#03020c', '#0a0724', '#150b3a'],
    skyL: ['#150f3a', '#1f1656', '#2a1d70'],
    mountain:  ['#070514', '#100a2a'],
    mountainL: ['#181040', '#241a58'],

/* ---------- 2. 应用状态（含持久化白名单校验） ---------- */
const STORE_KEY = 'cyber-aurora-v1';
const MODES = ['silent', 'demo', 'mic'];
const state = {
  paletteIndex: 0,
  mode: 'silent',          // silent | demo | mic
  speed: 0.6,              // 0..1
  intensity: 0.7,          // 0..1
  stars: 0.6,              // 0..1
  meteors: true,
  theme: 'dark',           // dark | light
  paused: false,
  zen: false
};
const prefersReduced = window.matchMedia
  && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      p: state.paletteIndex, m: state.mode,
      s: state.speed, i: state.intensity, st: state.stars,
      mt: state.meteors, th: state.theme, z: state.zen
    }));
  } catch (e) { /* 隐私模式 / 存储不可用时静默降级 */ }
}
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { d = null; }
  if (!d || typeof d !== 'object') return;
  const p = Math.round(num(d.p, 0));
  state.paletteIndex = clamp(p, 0, PALETTES.length - 1);
  state.speed = clamp(num(d.s, 0.6), 0, 1);
  state.intensity = clamp(num(d.i, 0.7), 0, 1);
  state.stars = clamp(num(d.st, 0.6), 0, 1);
  state.meteors = !!d.mt;
  state.theme = d.th === 'light' ? 'light' : 'dark';
  state.zen = !!d.z;
  state.mode = MODES.indexOf(d.m) >= 0 ? d.m : 'silent';
  if (d.m === 'mic') state.mode = 'silent'; // 麦克风权限不可静默恢复，回退静默
  if (prefersReduced) state.speed = Math.min(state.speed, 0.35);
}

/* ---------- 3. 画布与场景实体 ---------- */
const canvas = $('#scene');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

let starField = [];
function makeStars() {
  const count = Math.round(60 + state.stars * 440);
  starField = [];
  for (let i = 0; i < count; i++) {
    starField.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.9,
      r: 0.4 + Math.random() * 1.3,
      p: Math.random() * TAU,
      s: 0.5 + Math.random() * 2.2,
      warm: Math.random() < 0.18
    });
  }
}

let meteors = [];
let meteorTimer = 2.5;
function updateMeteors(dt) {
  meteorTimer -= dt;
  if (meteorTimer <= 0 && state.meteors && meteors.length < 3) {
    meteorTimer = 4 + Math.random() * 7;
    const dir = Math.random() < 0.5 ? 1 : -1;
    meteors.push({
      x: W * 0.1 + Math.random() * W * 0.8,
      y: Math.random() * H * 0.25,
      vx: dir * (220 + Math.random() * 180),
      vy: 140 + Math.random() * 120,
      life: 0, ttl: 1.1 + Math.random() * 0.6
    });
  }
  for (const m of meteors) { m.x += m.vx * dt; m.y += m.vy * dt; m.life += dt; }
  meteors = meteors.filter(m => m.life < m.ttl);
}

let ripples = [];
let kick = 0;
function spawnRipple(x, y) {
  ripples.push({ x: x, y: y, age: 0, ttl: 1.6, power: 1 });
  if (ripples.length > 6) ripples.shift();
  kick = Math.min(1, kick + 0.55);
}
function burstAt(x) {
  let s = 0;
  for (const r of ripples) {
    const dx = x - r.x;
    s += r.power * (1 - r.age / r.ttl) * Math.exp(-(dx * dx) / 33800);
  }
  return s * 46;
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.max(1, Math.round(W * DPR));
  canvas.height = Math.max(1, Math.round(H * DPR));
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeStars();
  if (state.paused) render(perf.t);
}
window.addEventListener('resize', resize);

/* ---------- 4. 音频引擎：静默 / 内置音景 / 麦克风 三态 ---------- */
const audio = {
  ctx: null, analyser: null, freq: null, master: null,
  micStream: null, micSrc: null,
  demoTimers: [], nodes: [], lastChord: 0, chordFn: null,

  ensure: function () {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ctx = new AC(); } catch (e) { return false; }
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 512;
    this.analyser.smoothingTimeConstant = 0.78;
    this.freq = new Uint8Array(this.analyser.frequencyBinCount);
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);
    return true;
  },
  setOutput: function (on) {
    if (!this.analyser) return;
    try { this.analyser.disconnect(); } catch (e) {}
    if (on && this.ctx) this.analyser.connect(this.ctx.destination);
  },
  stopAll: function () {
    this.demoTimers.forEach(clearInterval);
    this.demoTimers = [];
    this.chordFn = null;
    this.nodes.forEach(n => { try { n.stop(); } catch (e) {} });
    this.nodes = [];
    if (this.micSrc) { try { this.micSrc.disconnect(); } catch (e) {} this.micSrc = null; }
    if (this.micStream) {
      this.micStream.getTracks().forEach(t => t.stop());
      this.micStream = null;
    }
    this.setOutput(false);
  },
  track: function (node) {
    this.nodes.push(node);
    const self = this;
    node.onended = function () {
      const i = self.nodes.indexOf(node);
      if (i >= 0) self.nodes.splice(i, 1);
    };
  },
  startDemo: function () {
    if (!this.ensure()) return false;
    this.stopAll();
    this.setOutput(true);
    if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    const chords = [
      [220.00, 261.63, 329.63],
      [174.61, 220.00, 261.63],
      [196.00, 246.94, 293.66],
      [164.81, 196.00, 246.94]
    ];
    let step = 0;
    const self = this;
    const playChord = function () {
      if (state.mode !== 'demo' || !self.ctx || self.ctx.state !== 'running') return;
      const now = self.ctx.currentTime;
      if (now - self.lastChord < 2.5) return;
      self.lastChord = now;
      const t0 = now;
      const ch = chords[step++ % chords.length];
      const g = self.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.14, t0 + 1.4);
      g.gain.setValueAtTime(0.14, t0 + 3.0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.3);
      g.connect(self.master);
      for (let i = 0; i < ch.length; i++) {
        const o = self.ctx.createOscillator();
        o.type = i === 0 ? 'sine' : 'triangle';
        o.frequency.value = ch[i];
        o.detune.value = (i - 1) * 5;
        const og = self.ctx.createGain();
        og.gain.value = 0.32;
        o.connect(og); og.connect(g);
        o.start(t0); o.stop(t0 + 4.4);
        self.track(o);
      }
      const sub = self.ctx.createOscillator();
      sub.type = 'sine'; sub.frequency.value = ch[0] / 2;
      const sg = self.ctx.createGain(); sg.gain.value = 0.18;
      sub.connect(sg); sg.connect(g);
      sub.start(t0); sub.stop(t0 + 4.4);
      self.track(sub);
    };
    this.chordFn = playChord;
    playChord();
    this.demoTimers.push(setInterval(playChord, 4200));
    this.demoTimers.push(setInterval(function () {
      if (state.mode === 'demo') audio.sparkle(0.05 + Math.random() * 0.04);
    }, 1700));
    this.ctx.onstatechange = function () {
      if (audio.ctx && audio.ctx.state === 'running' && state.mode === 'demo' && audio.chordFn) audio.chordFn();
    };
    return true;
  },
  sparkle: function (vol) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const notes = [440, 523.25, 587.33, 659.25, 783.99, 880];
    const f = notes[(Math.random() * notes.length) | 0];
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = f;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol), t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + 1);
    this.track(o);
  },
  chime: function () {
    if (!this.ctx || this.ctx.state !== 'running' || state.mode !== 'demo') return;
    this.sparkle(0.11);
  },
  startMic: function () {
    if (!this.ensure()) return Promise.reject(new Error('AudioContext unavailable'));
    this.stopAll();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return Promise.reject(new Error('getUserMedia unsupported'));
    }
    const self = this;
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      if (state.mode !== 'mic') { // 期间用户已切走：立即释放
        stream.getTracks().forEach(t => t.stop());
        return false;
      }
      self.micStream = stream;
      self.setOutput(false);            // 麦克风不得外放，杜绝啸叫回路
      self.micSrc = self.ctx.createMediaStreamSource(stream);
      self.micSrc.connect(self.analyser);
      if (self.ctx.state === 'suspended') { try { self.ctx.resume(); } catch (e) {} }
      return true;
    });
  }
};

/* ---------- 5. 声能采样与平滑（三频段 + 总能） ---------- */
const smooth = { bass: 0.18, mid: 0.14, high: 0.10, total: 0.16 };
const eng = { bass: 0, mid: 0, high: 0, total: 0 };

function sampleAudio(dt, t) {
  if (state.mode !== 'silent' && audio.analyser && audio.ctx && audio.ctx.state === 'running') {
    audio.analyser.getByteFrequencyData(audio.freq);
    const f = audio.freq, n = f.length;
    const bE = Math.max(2, Math.round(n * 0.035));
    const mE = Math.max(bE + 2, Math.round(n * 0.22));
    const hE = Math.max(mE + 2, Math.round(n * 0.50));
    let b = 0, m = 0, h = 0;
    for (let i = 1; i < bE; i++) b += f[i];
    for (let i = bE; i < mE; i++) m += f[i];
    for (let i = mE; i < hE; i++) h += f[i];
    b /= Math.max(1, (bE - 1) * 255);
    m /= Math.max(1, (mE - bE) * 255);
    h /= Math.max(1, (hE - mE) * 255);
    if (state.mode === 'mic') { b *= 1.7; m *= 1.8; h *= 2.2; } // 语音电平补偿
    eng.bass = clamp(b, 0, 1); eng.mid = clamp(m, 0, 1); eng.high = clamp(h, 0, 1);
  } else {
    eng.bass = 0.22 + 0.16 * Math.sin(t * 0.55);
    eng.mid  = 0.18 + 0.12 * Math.sin(t * 0.37 + 1.7);
    eng.high = 0.10 + 0.08 * Math.sin(t * 0.83 + 3.1);
  }
  /* 呼吸下限：保证无声时极光依然活着 */
  eng.bass = Math.max(eng.bass, 0.06 + 0.05 * Math.sin(t * 0.50));
  eng.mid  = Math.max(eng.mid,  0.05 + 0.04 * Math.sin(t * 0.37 + 1.7));
  eng.high = Math.max(eng.high, 0.04 + 0.03 * Math.sin(t * 0.80 + 3.1));
  eng.total = clamp(eng.bass * 0.55 + eng.mid * 0.30 + eng.high * 0.25 + kick * 0.4, 0, 1);

  const k = 1 - Math.pow(0.0005, dt);
  smooth.bass += (eng.bass - smooth.bass) * k;
  smooth.mid += (eng.mid - smooth.mid) * k;
  smooth.high += (eng.high - smooth.high) * k;
  smooth.total += (eng.total - smooth.total) * Math.min(1, k * 1.6);
}

/* ---------- 6. 渲染层：天空 / 月 / 星 / 极光 / 流星 / 山脊 / 涟漪 / 暗角 ---------- */
function drawSky(pal) {
  const c = state.theme === 'dark' ? pal.sky : pal.skyL;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, c[0]);
  g.addColorStop(0.55, c[1]);
  g.addColorStop(1, c[2]);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 0.5 + 0.5 * state.intensity;
  const hg = ctx.createLinearGradient(0, H * 0.62, 0, H);
  hg.addColorStop(0, 'rgba(0,0,0,0)');
  hg.addColorStop(1, pal.horizon);
  ctx.fillStyle = hg;
  ctx.fillRect(0, H * 0.62, W, H * 0.38);
  ctx.globalAlpha = 1;
}

function drawMoon() {
  const mx = W * 0.78, my = H * 0.16;
  const mr = Math.min(W, H) * 0.028 + 8;
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(mx, my, mr * 0.2, mx, my, mr * 5);
  g.addColorStop(0, 'rgba(220,235,255,.26)');
  g.addColorStop(1, 'rgba(220,235,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(mx, my, mr * 5, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = state.theme === 'dark' ? '#e8eeff' : '#f6f9ff';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
  ctx.fillStyle = state.theme === 'dark' ? 'rgba(3,5,16,.55)' : 'rgba(18,24,60,.5)';
  ctx.beginPath(); ctx.arc(mx - mr * 0.35, my - mr * 0.22, mr * 0.92, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawStars(t) {
  ctx.globalCompositeOperation = 'source-over';
  const base = state.theme === 'dark' ? 1 : 0.8;
  for (let i = 0; i < starField.length; i++) {
    const st = starField[i];
    const tw = 0.55 + 0.45 * Math.sin(t * st.s + st.p);
    ctx.globalAlpha = (0.25 + 0.75 * tw) * base;
    ctx.fillStyle = st.warm ? '#ffe7c4' : '#dfe9ff';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawAurora(pal, t) {
  ctx.globalCompositeOperation = 'lighter';
  const step = Math.max(6, Math.round(W / 150));
  const gAlpha = 0.45 + 0.55 * state.intensity;
  for (let li = 0; li < pal.layers.length; li++) {
    const L = pal.layers[li];
    const n = Math.ceil(W / step) + 2;
    if (!L.buf || L.buf.n !== n) L.buf = { n: n, yc: new Float32Array(n), hh: new Float32Array(n) };
    const yc = L.buf.yc, hh = L.buf.hh;
    const tEff = t * (0.55 + L.spd);
    const amp = H * 0.055 * L.ampF * (0.55 + 1.5 * smooth.bass);
    const turb = smooth.high;
    const hBoost = (0.75 + 0.9 * smooth.mid) * (1 + 0.06 * Math.sin(t * 0.8 + li));
    let minY = 1e9, maxY = -1e9;

    for (let i = 0; i < n; i++) {
      const x = i * step;
      const w = fbm(x * L.freq, tEff, L.seed);
      const w2 = fbm(x * L.freq * 1.9 + 40, tEff * 0.7, L.seed + 3.1);
      const b = burstAt(x);
      yc[i] = H * L.baseY + w * amp
        + turb * H * 0.018 * Math.sin(x * 0.02 + tEff * 5 + L.seed * 2)
        - b * 0.42;
      hh[i] = H * L.hF * (0.7 + 0.3 * (w2 * 0.5 + 0.5)) * hBoost * (1 + b / 55);
      const yTop = yc[i] - hh[i];
      if (yTop < minY) minY = yTop;
      if (yc[i] > maxY) maxY = yc[i];
    }

    /* 主体幕帘：上沿多边形 + 下沿回程，屏空间垂直渐变 */
    ctx.beginPath();
    ctx.moveTo(0, yc[0] - hh[0]);
    for (let i = 1; i < n; i++) ctx.lineTo(i * step, yc[i] - hh[i]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(i * step, yc[i]);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, minY, 0, maxY + 4);
    g.addColorStop(0, L.top);
    g.addColorStop(0.62, L.mid);
    g.addColorStop(1, hexA(L.crest, 0.5));
    ctx.globalAlpha = gAlpha;
    ctx.fillStyle = g;
    ctx.fill();

    /* 垂直纹理条纹（时变噪声明暗，随波场漂移） */
    ctx.save();
    ctx.clip();
    const sStep = 16;
    const off = (tEff * 26) % sStep;
    ctx.lineWidth = 1.2;
    for (let sx = -sStep + off; sx < W + sStep; sx += sStep) {
      const al = fbm(sx * 0.017, tEff * 0.8, L.seed + 9) * 0.5 + 0.5;
      if (al < 0.35) continue;
      ctx.strokeStyle = hexA(L.crest, 0.03 + 0.10 * al * state.intensity);
      ctx.beginPath();
      ctx.moveTo(sx, minY - 4);
      ctx.lineTo(sx, maxY + 4);
      ctx.stroke();
    }
    ctx.restore();

    /* 光脊（宽晕 + 细亮芯双重描边） */
    ctx.beginPath();
    ctx.moveTo(0, yc[0]);
    for (let i = 1; i < n; i++) ctx.lineTo(i * step, yc[i]);
    ctx.globalAlpha = (0.5 + 0.5 * smooth.total) * (0.45 + 0.55 * state.intensity);
    ctx.strokeStyle = hexA(L.crest, 0.12);
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.strokeStyle = hexA(L.crest, 0.55);
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawMeteors() {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < meteors.length; i++) {
    const m = meteors[i];
    const k = m.life / m.ttl;
    const a = Math.sin(Math.min(1, k) * Math.PI);
    const sp = Math.sqrt(m.vx * m.vx + m.vy * m.vy) || 1;
    const tail = 90 + 60 * (1 - k);
    const tx = m.x - (m.vx / sp) * tail;
    const ty = m.y - (m.vy / sp) * tail;
    const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.9 * a).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function ridge(color, baseY, amp, s1, s2) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-4, H + 4);
  for (let x = -4; x <= W + 4; x += 6) {
    const h1 = 0.5 + 0.5 * fbm(x * 0.0028, 0, s1);
    const h2 = 0.5 + 0.5 * fbm(x * 0.0071, 0, s2);
    ctx.lineTo(x, baseY - H * amp * (h1 * 0.75 + h2 * 0.45));
  }
  ctx.lineTo(W + 4, H + 4);
  ctx.closePath();
  ctx.fill();
}
function drawMountains(pal) {
  const c = state.theme === 'dark' ? pal.mountain : pal.mountainL;
  ridge(c[1], H * 0.86, 0.055, 11.3, 3.1);
  ridge(c[0], H * 0.93, 0.045, 27.7, 7.9);
}

function drawRipples() {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < ripples.length; i++) {
    const r = ripples[i];
    const k = r.age / r.ttl;
    const a = 1 - k;
    const rad = 20 + k * 260;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.28 * a * a).toFixed(3) + ')';
    ctx.lineWidth = 2 * (1 - k) + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
    const g = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, rad * 0.7);
    g.addColorStop(0, 'rgba(190,255,240,' + (0.20 * a * a).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(190,255,240,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad * 0.7, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.42, W / 2, H * 0.5, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, state.theme === 'dark' ? 'rgba(0,0,0,.42)' : 'rgba(6,10,30,.30)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function render(t) {
  const pal = PALETTES[state.paletteIndex];
  drawSky(pal);
  drawMoon();
  drawStars(t);
  drawAurora(pal, t);
  drawMeteors();
  drawMountains(pal);
  drawRipples();
  drawVignette();
}

/* ---------- 7. 主循环（rAF + FPS 统计 + VU 表） ---------- */
const perf = { t: 0, last: 0, fps: 60, acc: 0, frames: 0 };
const fpsEl = $('#fps');
const vuBars = $$('#vu i');

function updateVU() {
  const vals = [smooth.bass, smooth.mid, smooth.high, smooth.total];
  for (let i = 0; i < vuBars.length; i++) {
    vuBars[i].style.transform = 'scaleY(' + (0.15 + 0.85 * vals[i]).toFixed(3) + ')';
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!perf.last) perf.last = now;
  let dt = (now - perf.last) / 1000;
  perf.last = now;
  if (dt > 0.1) dt = 0.1;
  if (dt <= 0) dt = 0.0001;
  perf.frames++; perf.acc += dt;
  if (perf.acc >= 0.5) {
    perf.fps = Math.round(perf.frames / perf.acc);
    perf.frames = 0; perf.acc = 0;
    fpsEl.textContent = perf.fps + ' FPS';
  }
  if (state.paused) return;
  const motionScale = prefersReduced ? 0.45 : 1;
  perf.t += dt * (0.3 + state.speed * 1.4) * motionScale;
  sampleAudio(dt, perf.t);
  updateMeteors(dt);
  for (let i = 0; i < ripples.length; i++) ripples[i].age += dt;
  ripples = ripples.filter(r => r.age < r.ttl);
  kick *= Math.pow(0.03, dt);
  render(perf.t);
  updateVU();
}

/* ---------- 8. HUD 控制台：DOM 引用与交互绑定 ---------- */
const modeText = $('#modeText');
const modeDot = $('#modeDot');
const palNameEl = $('#palName');
const swatchBox = $('#swatches');
const rgSpeed = $('#rgSpeed'), vSpeed = $('#vSpeed');
const rgIntensity = $('#rgIntensity'), vIntensity = $('#vIntensity');
const rgStars = $('#rgStars'), vStars = $('#vStars');
const ckMeteors = $('#ckMeteors');

const MODE_LABEL = {
  silent: '静默 · 呼吸态',
  demo: '音景 · 内置合成器',
  mic: '麦克风 · 实拾环境声'
};

const toastBox = $('#toasts');
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;                 // 仅用 textContent，杜绝 HTML 注入
  toastBox.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 400);
  }, 2600);
  while (toastBox.children.length > 4) toastBox.firstChild.remove();
}

function buildSwatches() {
  PALETTES.forEach((pal, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sw';
    b.dataset.index = String(i);
    b.title = pal.name;
    b.setAttribute('aria-label', '配色：' + pal.name);
    b.style.setProperty('--c1', pal.layers[0].crest);
    b.style.setProperty('--c2', pal.layers[2].crest);
    b.style.setProperty('--c3', pal.layers[3].crest);
    b.addEventListener('click', () => setPalette(i));
    swatchBox.appendChild(b);
  });
}

function setPalette(i, quiet) {
  state.paletteIndex = clamp(i, 0, PALETTES.length - 1);
  const pal = PALETTES[state.paletteIndex];
  document.documentElement.style.setProperty('--accent', pal.ui);
  palNameEl.textContent = pal.name;
  $$('.sw', swatchBox).forEach((el, k) => el.classList.toggle('active', k === state.paletteIndex));
  if (!quiet) { save(); toast('配色 · ' + pal.name); }
}

function setMode(mode) {
  if (MODES.indexOf(mode) < 0) return;
  state.mode = mode;
  if (mode === 'silent') {
    audio.stopAll();
    toast('静默模式 · 极光进入呼吸态');
  } else if (mode === 'demo') {
    const ok = audio.startDemo();
    if (!ok) { state.mode = 'silent'; toast('当前环境不支持 Web Audio，已保持静默'); }
    else toast('演示音景已启动 · 聆听极光之声');
  } else if (mode === 'mic') {
    audio.startMic().then(ok => {
      if (ok) toast('麦克风已连接 · 对它说话，或放一首歌');
    }).catch(err => {
      state.mode = 'silent';
      audio.stopAll();
      const why = err && err.name === 'NotAllowedError' ? '权限被拒绝' : '设备不可用';
      toast('麦克风不可用（' + why + '），已回退静默模式');
    });
  }
  save();
  syncUI();
}

function togglePause() {
  state.paused = !state.paused;
  document.body.classList.toggle('paused', state.paused);
  if (!state.paused) perf.last = 0;
  syncUI();
  save();
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.body.classList.toggle('light', state.theme === 'light');
  save();
  toast(state.theme === 'light' ? '主题 · 雾白（UI 明色）' : '主题 · 子夜（UI 暗色）');
}

function toggleZen(force) {
  state.zen = typeof force === 'boolean' ? force : !state.zen;
  document.body.classList.toggle('zen', state.zen);
  save();
}

function snapshot() {
  try {
    const a = document.createElement('a');
    a.download = 'cyber-aurora-' + new Date().toISOString().replace(/[:.]/g, '-') + '.png';
    a.href = canvas.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('画面已保存为 PNG');
  } catch (e) {
    toast('保存失败：' + (e && e.message ? e.message : '未知错误'));
  }
}

function syncUI() {
  $$('#segModes .seg-btn').forEach(b => {
    const on = b.dataset.mode === state.mode;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  modeText.textContent = MODE_LABEL[state.mode] || state.mode;
  modeDot.className = 'dot ' + (state.paused ? 'paused' : state.mode);
  vSpeed.textContent = String(Math.round(state.speed * 100));
  vIntensity.textContent = String(Math.round(state.intensity * 100));
  vStars.textContent = String(Math.round(state.stars * 100));
  rgSpeed.value = String(Math.round(state.speed * 100));
  rgIntensity.value = String(Math.round(state.intensity * 100));
  rgStars.value = String(Math.round(state.stars * 100));
  ckMeteors.checked = state.meteors;
  document.body.classList.toggle('light', state.theme === 'light');
  document.body.classList.toggle('paused', state.paused);
  document.body.classList.toggle('zen', state.zen);
}

function bindUI() {
  $$('#segModes .seg-btn').forEach(b =>
    b.addEventListener('click', () => setMode(b.dataset.mode)));

  rgSpeed.addEventListener('input', () => {
    state.speed = (+rgSpeed.value) / 100; vSpeed.textContent = rgSpeed.value; save();
  });
  rgIntensity.addEventListener('input', () => {
    state.intensity = (+rgIntensity.value) / 100; vIntensity.textContent = rgIntensity.value; save();
  });
  rgStars.addEventListener('input', () => {
    state.stars = (+rgStars.value) / 100; vStars.textContent = rgStars.value; makeStars(); save();
  });
  ckMeteors.addEventListener('change', () => { state.meteors = ckMeteors.checked; save(); });

  $('#btnPause').addEventListener('click', togglePause);
  $('#btnShot').addEventListener('click', snapshot);
  $('#btnTheme').addEventListener('click', toggleTheme);
  $('#btnZen').addEventListener('click', () => toggleZen(true));
  $('#peek').addEventListener('click', () => toggleZen(false));

  canvas.addEventListener('pointerdown', e => {
    spawnRipple(e.clientX, e.clientY);
    audio.chime();
  });

  window.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' && e.target.type !== 'range') return;
    switch (e.code) {
      case 'Space': e.preventDefault(); togglePause(); break;
      case 'KeyM': {
        const i = MODES.indexOf(state.mode);
        setMode(MODES[(i + 1) % MODES.length]);
        break;
      }
      case 'KeyS': snapshot(); break;
      case 'KeyT': toggleTheme(); break;
      case 'KeyH': toggleZen(); break;
      case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4':
        setPalette(e.code.charCodeAt(5) - 49);
        break;
    }
  });

  /* 任意手势解锁被浏览器策略挂起的 AudioContext（iOS / 自动播放策略） */
  const unlock = () => {
    if (audio.ctx && audio.ctx.state === 'suspended') {
      try { audio.ctx.resume(); } catch (e) {}
    }
  };
  window.addEventListener('pointerdown', unlock, { passive: true });
  window.addEventListener('keydown', unlock, { passive: true });

  document.addEventListener('visibilitychange', () => {
    if (!audio.ctx) return;
    if (document.hidden) {
      if (audio.ctx.state === 'running') { try { audio.ctx.suspend(); } catch (e) {} }
    } else if (state.mode !== 'silent') {
      try { audio.ctx.resume(); } catch (e) {}
    }
  });
}

/* ---------- 9. 启动 ---------- */
function init() {
  load();
  buildSwatches();
  bindUI();
  resize();
  setPalette(state.paletteIndex, true);
  syncUI();
  if (state.mode === 'demo') audio.startDemo();
  requestAnimationFrame(frame);
  toast(state.mode === 'demo'
    ? '欢迎回来 · 演示音景播放中（点击任意处可解锁声音）'
    : '欢迎来到赛博极光 · 试试「音景」「麦克风」或点击画面');
}
init();
</script>
</body>
</html>
