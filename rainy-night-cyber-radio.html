<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨夜赛博电台：无限生成式 Lo-Fi 氛围音响工作站</title>
    <style>
        /* CSS Variables 定义 */
        :root {
            /* 主色调 */
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff41;
            --neon-amber: #ffaa00;
            
            /* 深色主题 */
            --bg-primary: #0a0a1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: rgba(255, 255, 255, 0.1);
            
            /* 间距 */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            
            /* 字体 */
            --font-main: 'Courier New', monospace;
            --font-size-sm: 0.8rem;
            --font-size-md: 1rem;
            --font-size-lg: 1.2rem;
            --font-size-xl: 1.5rem;
            
            /* 效果 */
            --blur-amount: 10px;
            --glow-strength: 0 0 10px;
            --transition-speed: 0.3s;
        }
        
        /* 浅色主题 */
        [data-theme="light"] {
            --bg-primary: #f0f0f5;
            --bg-secondary: #e0e0e5;
            --bg-tertiary: #d0d0d5;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a5a;
            --border-color: rgba(0, 0, 0, 0.1);
        }
        
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }
        
        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            z-index: 2;
        }
        
        /* 背景动画容器 */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        
        /* 雨滴样式 */
        .raindrop {
            position: absolute;
            width: 2px;
            height: 15px;
            background: linear-gradient(transparent, var(--neon-blue));
            border-radius: 0 0 2px 2px;
            animation: fall linear infinite;
            opacity: 0.6;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }
        
        /* 城市灯光效果 */
        .city-lights {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(
                transparent,
                rgba(0, 243, 255, 0.1) 30%,
                rgba(255, 0, 255, 0.1) 70%,
                transparent
            );
            filter: blur(var(--blur-amount));
        }
        
        /* 标题样式 */
        .header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
            padding: var(--spacing-lg);
        }
        
        .title {
            font-size: var(--font-size-xl);
            font-weight: bold;
            color: var(--neon-blue);
            text-shadow: var(--glow-strength) var(--neon-blue);
            letter-spacing: 2px;
            animation: neonFlicker 3s infinite alternate;
        }
        
        @keyframes neonFlicker {
            0%, 100% {
                opacity: 1;
                text-shadow: var(--glow-strength) var(--neon-blue);
            }
            50% {
                opacity: 0.8;
                text-shadow: 0 0 5px var(--neon-blue);
            }
        }
        
        .subtitle {
            font-size: var(--font-size-md);
            color: var(--neon-pink);
            margin-top: var(--spacing-sm);
            text-shadow: var(--glow-strength) var(--neon-pink);
        }
        
        /* 音频可视化区域 */
        .visualizer-container {
            background: var(--bg-secondary);
            border-radius: var(--spacing-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(var(--blur-amount));
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .visualizer {
            height: 150px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            padding: var(--spacing-sm);
        }
        
        .bar {
            width: 4px;
            background: linear-gradient(var(--neon-blue), var(--neon-pink));
            border-radius: 2px 2px 0 0;
            transition: height 0.1s ease;
        }
        
        /* 控制面板 */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-md);
            background: var(--bg-secondary);
            border-radius: var(--spacing-md);
            padding: var(--spacing-lg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(var(--blur-amount));
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .control-group {
            background: var(--bg-tertiary);
            border-radius: var(--spacing-sm);
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
        }
        
        .control-label {
            display: block;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .control-value {
            font-size: var(--font-size-lg);
            color: var(--neon-green);
            margin-bottom: var(--spacing-sm);
        }
        
        /* 滑块样式 */
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-primary);
            outline: none;
            -webkit-appearance: none;
            transition: background var(--transition-speed);
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--neon-blue);
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-blue);
            transition: transform 0.2s;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        /* 按钮样式 */
        .btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            border-radius: var(--spacing-sm);
            font-family: var(--font-main);
            font-size: var(--font-size-md);
            cursor: pointer;
            transition: all var(--transition-speed);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            color: var(--bg-primary);
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 243, 255, 0.4);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }
        
        .btn-secondary:hover {
            background: rgba(0, 243, 255, 0.1);
        }
        
        /* 主题切换按钮 */
        .theme-toggle {
            position: fixed;
            top: var(--spacing-md);
            right: var(--spacing-md);
            z-index: 100;
            background: var(--bg-secondary);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            transition: all var(--transition-speed);
        }
        
        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
        }
        
        /* 状态指示器 */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm);
            background: var(--bg-primary);
            border-radius: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-green);
            animation: pulse 2s infinite;
        }
        
        .status-dot.paused {
            background: var(--neon-amber);
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 5px var(--neon-green);
            }
            50% {
                opacity: 0.5;
                box-shadow: 0 0 15px var(--neon-green);
            }
        }
        
        /* 选择框样式 */
        select {
            width: 100%;
            padding: var(--spacing-sm);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            border-radius: var(--spacing-sm);
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: var(--neon-blue);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-sm);
            }
            
            .title {
                font-size: var(--font-size-lg);
            }
            
            .control-panel {
                grid-template-columns: 1fr;
            }
            
            .visualizer {
                height: 100px;
            }
            
            .theme-toggle {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
        
        /* 玻璃拟态效果 */
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* 霓虹灯边框 */
        .neon-border {
            border: 2px solid var(--neon-blue);
            box-shadow: 
                0 0 5px var(--neon-blue),
                inset 0 0 5px var(--neon-blue);
        }
        
        /* 加载状态 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--bg-secondary);
            border-top: 3px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        /* 页脚 */
        .footer {
            text-align: center;
            padding: var(--spacing-lg);
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            margin-top: var(--spacing-xl);
        }
    </style>
</head>
<body>
    <!-- 加载状态 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>
    
    <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="themeToggle" title="切换主题">
        🌙
    </button>
    
    <!-- 背景动画 -->
    <div class="background-animation" id="backgroundAnimation">
        <div class="city-lights"></div>
    </div>
    
    <!-- 主容器 -->
    <div class="container">
        <!-- 标题 -->
        <header class="header">
            <h1 class="title">🎧 雨夜赛博电台</h1>
            <p class="subtitle">无限生成式 Lo-Fi 氛围音响工作站</p>
        </header>
        
        <!-- 音频可视化 -->
        <div class="visualizer-container glass-effect">
            <div class="visualizer" id="visualizer">
                <!-- 频谱条将由 JavaScript 动态生成 -->
            </div>
        </div>
        
        <!-- 控制面板 -->
        <div class="control-panel">
            <!-- 播放控制 -->
            <div class="control-group">
                <label class="control-label">播放控制</label>
                <button class="btn btn-primary" id="playBtn" style="width: 100%;">
                    ▶ 开始播放
                </button>
                <div class="status-indicator">
                    <div class="status-dot paused" id="statusDot"></div>
                    <span id="statusText">已暂停</span>
                </div>
            </div>
            
            <!-- 节奏控制 -->
            <div class="control-group">
                <label class="control-label">节奏速度 (BPM)</label>
                <div class="control-value" id="bpmValue">80</div>
                <input type="range" id="bpmSlider" min="60" max="120" value="80">
            </div>
            
            <!-- 雨声控制 -->
            <div class="control-group">
                <label class="control-label">雨声强度</label>
                <div class="control-value" id="rainValue">50%</div>
                <input type="range" id="rainSlider" min="0" max="100" value="50">
            </div>
            
            <!-- 和弦复杂度 -->
            <div class="control-group">
                <label class="control-label">和弦复杂度</label>
                <select id="chordSelect">
                    <option value="simple">简单 - 基础和弦</option>
                    <option value="medium" selected>中等 - 爵士和弦</option>
                    <option value="complex">复杂 - 扩展和弦</option>
                </select>
            </div>
            
            <!-- 氛围音量 -->
            <div class="control-group">
                <label class="control-label">氛围音量</label>
                <div class="control-value" id="ambienceValue">70%</div>
                <input type="range" id="ambienceSlider" min="0" max="100" value="70">
            </div>
            
            <!-- 雷声控制 -->
            <div class="control-group">
                <label class="control-label">雷声效果</label>
                <button class="btn btn-secondary" id="thunderBtn" style="width: 100%;">
                    ⚡ 触发雷声
                </button>
            </div>
        </div>
        
        <!-- 页脚 -->
        <footer class="footer">
            <p>雨夜赛博电台 v1.0 | 由 Web Audio API 驱动</p>
            <p>建议使用 Chrome 或 Firefox 浏览器获得最佳体验</p>
        </footer>
    </div>

    <script>
        // 音频引擎类
        class CyberRadioEngine {
            constructor() {
                this.audioContext = null;
                this.isPlaying = false;
                this.bpm = 80;
                this.rainIntensity = 0.5;
                this.chordComplexity = 'medium';
                this.ambienceVolume = 0.7;
                this.nodes = {};
                this.timers = [];
                this.visualizerBars = [];
                this.analyser = null;
                this.animationId = null;
                
                // 音乐数据
                this.scales = {
                    simple: [0, 2, 4, 5, 7, 9, 11], // 大调音阶
                    medium: [0, 2, 3, 5, 7, 8, 10], // 多利亚调式
                    complex: [0, 1, 3, 5, 6, 8, 10]  // 弗里几亚调式
                };
                
                this.chordProgressions = {
                    simple: [[0, 4, 7], [5, 9, 12], [7, 11, 14], [0, 4, 7]],
                    medium: [[0, 4, 7, 11], [5, 9, 12, 16], [7, 11, 14, 17], [0, 4, 7, 10]],
                    complex: [[0, 3, 7, 10, 14], [5, 8, 12, 15, 19], [7, 10, 14, 17, 21], [0, 3, 7, 10, 14]]
                };
                
                this.currentChordIndex = 0;
                this.noteIndex = 0;
                
                this.init();
            }
            
            init() {
                this.setupVisualizer();
                this.setupEventListeners();
                this.hideLoading();
            }
            
            setupVisualizer() {
                const visualizer = document.getElementById('visualizer');
                visualizer.innerHTML = '';
                
                // 创建64个频谱条
                for (let i = 0; i < 64; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    bar.style.height = '5px';
                    visualizer.appendChild(bar);
                    this.visualizerBars.push(bar);
                }
            }
            
            setupEventListeners() {
                // 播放按钮
                document.getElementById('playBtn').addEventListener('click', () => {
                    this.togglePlayback();
                });
                
                // BPM 滑块
                document.getElementById('bpmSlider').addEventListener('input', (e) => {
                    this.bpm = parseInt(e.target.value);
                    document.getElementById('bpmValue').textContent = this.bpm;
                });
                
                // 雨声滑块
                document.getElementById('rainSlider').addEventListener('input', (e) => {
                    this.rainIntensity = parseInt(e.target.value) / 100;
                    document.getElementById('rainValue').textContent = `${e.target.value}%`;
                    if (this.nodes.rainGain && this.audioContext) {
                        this.nodes.rainGain.gain.setTargetAtTime(this.rainIntensity, this.audioContext.currentTime, 0.05);
                    }
                    this.updateRaindrops();
                });
                
                // 和弦复杂度
                document.getElementById('chordSelect').addEventListener('change', (e) => {
                    this.chordComplexity = e.target.value;
                });
                
                // 氛围音量
                document.getElementById('ambienceSlider').addEventListener('input', (e) => {
                    this.ambienceVolume = parseInt(e.target.value) / 100;
                    document.getElementById('ambienceValue').textContent = `${e.target.value}%`;
                    if (this.nodes.ambienceGain && this.audioContext) {
                        this.nodes.ambienceGain.gain.setTargetAtTime(this.ambienceVolume * 0.6, this.audioContext.currentTime, 0.05);
                    }
                });
                
                // 雷声按钮
                document.getElementById('thunderBtn').addEventListener('click', () => {
                    this.triggerThunder();
                });
                
                // 主题切换
                document.getElementById('themeToggle').addEventListener('click', () => {
                    this.toggleTheme();
                });
                
                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.togglePlayback();
                    } else if (e.code === 'KeyT') {
                        this.triggerThunder();
                    }
                });
            }
            
            hideLoading() {
                setTimeout(() => {
                    document.getElementById('loadingOverlay').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loadingOverlay').style.display = 'none';
                    }, 500);
                }, 1000);
            }
            
            async initAudioContext() {
                if (this.audioContext) return;
                
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // 1. 创建专业级防爆音母带压限器 (Master Limiter / DynamicsCompressorNode)
                this.compressor = this.audioContext.createDynamicsCompressor();
                this.compressor.threshold.setValueAtTime(-12, this.audioContext.currentTime);
                this.compressor.knee.setValueAtTime(30, this.audioContext.currentTime);
                this.compressor.ratio.setValueAtTime(12, this.audioContext.currentTime);
                this.compressor.attack.setValueAtTime(0.003, this.audioContext.currentTime);
                this.compressor.release.setValueAtTime(0.25, this.audioContext.currentTime);
                
                // 2. 创建主增益节点并连接至压限器
                this.nodes.masterGain = this.audioContext.createGain();
                this.nodes.masterGain.gain.setValueAtTime(0.7, this.audioContext.currentTime);
                this.nodes.masterGain.connect(this.compressor);
                
                // 3. 压限器输出连接至频谱分析器与系统声卡
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 128;
                this.compressor.connect(this.analyser);
                this.compressor.connect(this.audioContext.destination);
                
                // 4. 创建各独立通道增益
                this.nodes.ambienceGain = this.audioContext.createGain();
                this.nodes.ambienceGain.gain.setValueAtTime(this.ambienceVolume * 0.6, this.audioContext.currentTime);
                this.nodes.ambienceGain.connect(this.nodes.masterGain);
                
                this.nodes.rainGain = this.audioContext.createGain();
                this.nodes.rainGain.gain.setValueAtTime(this.rainIntensity, this.audioContext.currentTime);
                this.nodes.rainGain.connect(this.nodes.ambienceGain);
                
                this.nodes.drumGain = this.audioContext.createGain();
                this.nodes.drumGain.gain.setValueAtTime(0.65, this.audioContext.currentTime);
                this.nodes.drumGain.connect(this.nodes.masterGain);
                
                this.nodes.chordGain = this.audioContext.createGain();
                this.nodes.chordGain.gain.setValueAtTime(0.45, this.audioContext.currentTime);
                this.nodes.chordGain.connect(this.nodes.masterGain);
                
                this.nodes.bassGain = this.audioContext.createGain();
                this.nodes.bassGain.gain.setValueAtTime(0.5, this.audioContext.currentTime);
                this.nodes.bassGain.connect(this.nodes.masterGain);
            }
            
            togglePlayback() {
                if (this.isPlaying) {
                    this.stop();
                } else {
                    this.start();
                }
            }
            
            async start() {
                await this.initAudioContext();
                
                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                }
                
                this.isPlaying = true;
                this.updateUI();
                this.startRainAmbience();
                this.startDrumPattern();
                this.startChordProgression();
                this.startBassLine();
                this.startVisualizer();
            }
            
            stop() {
                this.isPlaying = false;
                this.updateUI();
                
                // 清除所有定时器
                this.timers.forEach(timer => clearTimeout(timer));
                this.timers = [];
                
                // 停止可视化
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
                
                // 停止音频节点
                this.stopAllNodes();
            }
            
            stopAllNodes() {
                // 停止氛围音
                if (this.nodes.rainNoise) {
                    try { this.nodes.rainNoise.stop(); } catch (e) {}
                    this.nodes.rainNoise = null;
                }
                
                // 停止鼓组
                if (this.nodes.drumOsc) {
                    try { this.nodes.drumOsc.stop(); } catch (e) {}
                    this.nodes.drumOsc = null;
                }
                
                // 停止和弦
                if (this.nodes.chordOscs) {
                    this.nodes.chordOscs.forEach(osc => {
                        try { osc.stop(); } catch (e) {}
                    });
                    this.nodes.chordOscs = null;
                }
                
                // 停止贝斯
                if (this.nodes.bassOsc) {
                    try { this.nodes.bassOsc.stop(); } catch (e) {}
                    this.nodes.bassOsc = null;
                }
            }
            
            updateUI() {
                const playBtn = document.getElementById('playBtn');
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');
                
                if (this.isPlaying) {
                    playBtn.textContent = '⏸ 暂停播放';
                    statusDot.classList.remove('paused');
                    statusText.textContent = '正在播放';
                } else {
                    playBtn.textContent = '▶ 开始播放';
                    statusDot.classList.add('paused');
                    statusText.textContent = '已暂停';
                }
            }
            
            // 温暖细腻的赛博雨声生成（粉红噪声滤波）
            startRainAmbience() {
                if (!this.isPlaying || !this.audioContext) return;
                
                // 生成4秒循环的粉红噪声缓冲（Pink Noise）
                const bufferSize = 4 * this.audioContext.sampleRate;
                const noiseBuffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.08;
                    b6 = white * 0.115926;
                }
                
                this.nodes.rainNoise = this.audioContext.createBufferSource();
                this.nodes.rainNoise.buffer = noiseBuffer;
                this.nodes.rainNoise.loop = true;
                
                // 双级滤波：消除尖锐高频，保留温润雨声质感
                const lowpass = this.audioContext.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.setValueAtTime(1600, this.audioContext.currentTime);
                lowpass.Q.setValueAtTime(0.5, this.audioContext.currentTime);
                
                const highpass = this.audioContext.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.setValueAtTime(200, this.audioContext.currentTime);
                
                this.nodes.rainNoise.connect(lowpass);
                lowpass.connect(highpass);
                highpass.connect(this.nodes.rainGain);
                
                this.nodes.rainNoise.start();
            }
            
            // 鼓组节拍生成（彻底修复递归死循环，规整单小节步进调度）
            startDrumPattern() {
                if (!this.isPlaying || !this.audioContext) return;
                
                const stepDuration = (60 / this.bpm) / 2; // 8分音符步长 (秒)
                // 精致 Lo-Fi 律动节奏型：[Kick, Hat, Snare, Hat, Kick, Hat, Snare, Hat]
                const pattern = [
                    { type: 'kick',  velocity: 0.9 },
                    { type: 'hat',   velocity: 0.3 },
                    { type: 'snare', velocity: 0.6 },
                    { type: 'hat',   velocity: 0.3 },
                    { type: 'kick',  velocity: 0.75 },
                    { type: 'hat',   velocity: 0.35 },
                    { type: 'snare', velocity: 0.65 },
                    { type: 'hat',   velocity: 0.25 }
                ];
                
                // 1. 调度当前小节各拍点（单次触发，不进行递归）
                pattern.forEach((hit, index) => {
                    const timer = setTimeout(() => {
                        if (this.isPlaying) {
                            this.playDrum(hit.type, hit.velocity);
                        }
                    }, index * stepDuration * 1000);
                    this.timers.push(timer);
                });
                
                // 2. 当前小节播完后，由单一定时器平稳推进到下一个小节（无多重累积）
                const measureTimer = setTimeout(() => {
                    if (this.isPlaying) {
                        this.startDrumPattern();
                    }
                }, pattern.length * stepDuration * 1000);
                this.timers.push(measureTimer);
            }
            
            playDrum(type, velocity) {
                if (!this.audioContext || this.audioContext.state !== 'running') return;
                const now = this.audioContext.currentTime;
                
                if (type === 'kick') {
                    // 饱满温暖的 Lo-Fi 808 电子底鼓
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(38, now + 0.09);
                    
                    gain.gain.setValueAtTime(velocity * 0.75, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    
                    osc.connect(gain);
                    gain.connect(this.nodes.drumGain);
                    
                    osc.start(now);
                    osc.stop(now + 0.26);
                } else if (type === 'snare') {
                    // 柔和复古边缘小军鼓 (Rim/Snare)
                    const bufferSize = Math.floor(this.audioContext.sampleRate * 0.12);
                    const noiseBuffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                    const data = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    
                    const noise = this.audioContext.createBufferSource();
                    noise.buffer = noiseBuffer;
                    
                    const filter = this.audioContext.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(1600, now);
                    filter.Q.setValueAtTime(1.5, now);
                    
                    const gain = this.audioContext.createGain();
                    gain.gain.setValueAtTime(velocity * 0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.nodes.drumGain);
                    
                    noise.start(now);
                    noise.stop(now + 0.13);
                } else if (type === 'hat') {
                    // 细腻黑胶质感闭镲 (Closed Hat)
                    const bufferSize = Math.floor(this.audioContext.sampleRate * 0.04);
                    const noiseBuffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                    const data = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    
                    const noise = this.audioContext.createBufferSource();
                    noise.buffer = noiseBuffer;
                    
                    const filter = this.audioContext.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.setValueAtTime(6500, now);
                    
                    const gain = this.audioContext.createGain();
                    gain.gain.setValueAtTime(velocity * 0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.nodes.drumGain);
                    
                    noise.start(now);
                    noise.stop(now + 0.05);
                }
            }
            
            // 梦幻 Lo-Fi 和弦进行
            startChordProgression() {
                if (!this.isPlaying || !this.audioContext) return;
                
                const beatDuration = 60 / this.bpm;
                const chordDuration = beatDuration * 4; // 每个和弦持续4拍
                
                // 启动时立即演奏第一个和弦
                this.playChord(chordDuration);
                this.currentChordIndex = (this.currentChordIndex + 1) % 4;
                
                const timer = setTimeout(() => {
                    if (this.isPlaying) {
                        this.startChordProgression();
                    }
                }, chordDuration * 1000);
                this.timers.push(timer);
            }
            
            playChord(duration) {
                if (!this.audioContext || this.audioContext.state !== 'running') return;
                
                const chords = this.chordProgressions[this.chordComplexity];
                const chord = chords[this.currentChordIndex];
                const baseNote = 60; // C4
                const now = this.audioContext.currentTime;
                
                this.nodes.chordOscs = [];
                
                chord.forEach((interval, index) => {
                    const osc = this.audioContext.createOscillator();
                    const filter = this.audioContext.createBiquadFilter();
                    const gain = this.audioContext.createGain();
                    
                    // 模拟复古模拟合成器音色
                    osc.type = index % 2 === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(this.midiToFrequency(baseNote + interval), now);
                    
                    // 温暖低通滤波（削弱刺耳高频，营造雨夜氛围）
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(900, now);
                    
                    // 平滑 ADSR 包络（轻柔渐入渐出，彻底防止破音）
                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(0.12, now + 0.3);
                    gain.gain.linearRampToValueAtTime(0.001, now + (duration || 2));
                    
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.nodes.chordGain);
                    
                    osc.start(now);
                    osc.stop(now + (duration || 2) + 0.1);
                    
                    this.nodes.chordOscs.push(osc);
                });
            }
            
            // 贝斯线生成
            startBassLine() {
                if (!this.isPlaying || !this.audioContext) return;
                
                const beatDuration = 60 / this.bpm;
                const bassPattern = [0, 0, 7, 5, 0, 0, 7, 5]; // 8步贝斯律动
                const stepTime = (beatDuration * 1000) / 2;
                
                this.playBassNote(bassPattern[this.noteIndex], stepTime / 1000);
                this.noteIndex = (this.noteIndex + 1) % bassPattern.length;
                
                const timer = setTimeout(() => {
                    if (this.isPlaying) {
                        this.startBassLine();
                    }
                }, stepTime);
                this.timers.push(timer);
            }
            
            playBassNote(interval, duration) {
                if (!this.audioContext || this.audioContext.state !== 'running') return;
                const now = this.audioContext.currentTime;
                
                const osc = this.audioContext.createOscillator();
                const filter = this.audioContext.createBiquadFilter();
                const gain = this.audioContext.createGain();
                
                // 三角波 + 低通滤波 = 温暖弹性的模拟 Sub-Bass
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(this.midiToFrequency(36 + interval), now);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(320, now);
                
                const noteDur = Math.min(duration || 0.4, 0.45);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.28, now + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, now + noteDur);
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.nodes.bassGain);
                
                osc.start(now);
                osc.stop(now + noteDur + 0.05);
                
                this.nodes.bassOsc = osc;
            }
            
            // 雷声效果（远空沉闷轰鸣，防尖锐突变）
            triggerThunder() {
                if (!this.audioContext) return;
                const now = this.audioContext.currentTime;
                
                // 创建3秒低频噪声
                const bufferSize = 3 * this.audioContext.sampleRate;
                const noiseBuffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                
                const noise = this.audioContext.createBufferSource();
                noise.buffer = noiseBuffer;
                
                // 低通滤波器
                const lowpass = this.audioContext.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.setValueAtTime(180, now);
                lowpass.frequency.linearRampToValueAtTime(80, now + 2.5);
                
                // 平滑滚雷增益包络
                const gain = this.audioContext.createGain();
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.5, now + 0.25);
                gain.gain.linearRampToValueAtTime(0.001, now + 3);
                
                noise.connect(lowpass);
                lowpass.connect(gain);
                gain.connect(this.nodes.ambienceGain);
                
                noise.start(now);
                noise.stop(now + 3.1);
                
                // 视觉效果
                this.flashScreen();
            }
            
            flashScreen() {
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(255, 255, 255, 0.1);
                    z-index: 999;
                    pointer-events: none;
                    animation: flash 0.5s ease-out forwards;
                `;
                
                document.body.appendChild(overlay);
                
                setTimeout(() => {
                    overlay.remove();
                }, 500);
            }
            
            // 可视化
            startVisualizer() {
                if (!this.isPlaying || !this.analyser) return;
                
                const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                
                const updateVisualizer = () => {
                    if (!this.isPlaying) return;
                    
                    this.analyser.getByteFrequencyData(dataArray);
                    
                    this.visualizerBars.forEach((bar, index) => {
                        const value = dataArray[index] || 0;
                        const height = Math.max(5, (value / 255) * 100);
                        bar.style.height = `${height}px`;
                    });
                    
                    this.animationId = requestAnimationFrame(updateVisualizer);
                };
                
                updateVisualizer();
            }
            
            // 工具函数
            midiToFrequency(midi) {
                return 440 * Math.pow(2, (midi - 69) / 12);
            }
            
            // 雨滴动画
            updateRaindrops() {
                const container = document.getElementById('backgroundAnimation');
                const existingDrops = container.querySelectorAll('.raindrop');
                
                // 根据雨声强度调整雨滴数量
                const targetCount = Math.floor(this.rainIntensity * 100);
                
                // 移除多余的雨滴
                while (existingDrops.length > targetCount) {
                    const drop = existingDrops[existingDrops.length - 1];
                    drop.remove();
                    existingDrops.pop();
                }
                
                // 添加缺少的雨滴
                while (existingDrops.length < targetCount) {
                    const drop = document.createElement('div');
                    drop.className = 'raindrop';
                    drop.style.left = `${Math.random() * 100}%`;
                    drop.style.animationDuration = `${0.5 + Math.random() * 1}s`;
                    drop.style.animationDelay = `${Math.random() * 2}s`;
                    container.appendChild(drop);
                    existingDrops.push(drop);
                }
            }
            
            // 主题切换
            toggleTheme() {
                const body = document.body;
                const themeToggle = document.getElementById('themeToggle');
                
                if (body.getAttribute('data-theme') === 'light') {
                    body.removeAttribute('data-theme');
                    themeToggle.textContent = '🌙';
                } else {
                    body.setAttribute('data-theme', 'light');
                    themeToggle.textContent = '☀️';
                }
            }
        }
        
        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            const radio = new CyberRadioEngine();
            radio.updateRaindrops();
            
            // 添加闪电动画样式
            const style = document.createElement('style');
            style.textContent = `
                @keyframes flash {
                    0% { opacity: 1; }
                    100% { opacity: 0; }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
