<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="description" content="Matrix 数字雨：纯黑背景、绿色霓虹字符下落、点击/触摸产生字符涟漪、速度可调。零依赖单文件。">
<title>Matrix · 数字雨 Digital Rain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='black'/%3E%3Crect x='3' y='2' width='3' height='7' fill='%2300ff41'/%3E%3Crect x='8' y='5' width='3' height='9' fill='%2300ff41'/%3E%3Crect x='11' y='1' width='2' height='4' fill='%2300ff41'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#000000;
    --neon:#00ff41;
    --neon-soft:rgba(0,255,65,.55);
    --neon-dim:rgba(0,255,65,.18);
    --ink:#eaffef;
    --hud-bg:rgba(0,12,4,.55);
    --hud-border:rgba(0,255,65,.28);
    --hud-blur:saturate(140%) blur(10px);
    --radius:14px;
    --font-mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",ui-monospace,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);overflow:hidden;
    font-family:var(--font-mono);
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #rain{position:fixed;inset:0;display:block;cursor:crosshair}
  .hud{
    position:fixed;z-index:5;pointer-events:none;
    top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));
    color:var(--neon);text-shadow:0 0 8px var(--neon-soft),0 0 24px var(--neon-dim);
  }
  .hud .brand{font-size:clamp(17px,2.6vw,24px);font-weight:700;letter-spacing:.35em}
  .hud .brand .cursor{display:inline-block;width:.6em;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .hud .sub{margin-top:6px;font-size:11px;letter-spacing:.18em;color:var(--neon-soft);text-shadow:none}
  .hud .stats{margin-top:10px;font-size:11px;letter-spacing:.12em;color:rgba(0,255,65,.66);text-shadow:none}
  .hud .stats b{color:var(--ink);font-weight:600}
  .controls{
    position:fixed;z-index:10;left:50%;transform:translateX(-50%);
    bottom:max(14px,env(safe-area-inset-bottom));
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;
    max-width:calc(100vw - 20px);padding:9px 10px;border-radius:var(--radius);
    background:var(--hud-bg);border:1px solid var(--hud-border);
    -webkit-backdrop-filter:var(--hud-blur);backdrop-filter:var(--hud-blur);
    box-shadow:0 0 26px rgba(0,255,65,.10),inset 0 0 18px rgba(0,255,65,.05);
  }
  .controls button{
    appearance:none;-webkit-appearance:none;font:600 12px/1 var(--font-mono);
    color:var(--neon);background:rgba(0,255,65,.06);border:1px solid rgba(0,255,65,.35);
    border-radius:9px;padding:8px 12px;cursor:pointer;touch-action:manipulation;
    transition:background .15s ease,color .15s ease,box-shadow .15s ease,transform .1s ease;
  }
  .controls button:hover{background:rgba(0,255,65,.16);box-shadow:0 0 12px var(--neon-dim)}
  .controls button:active{transform:scale(.96)}
  .controls button.active{background:var(--neon);border-color:var(--neon);color:#012409;box-shadow:0 0 16px var(--neon-soft)}
  .controls button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .divider{width:1px;align-self:stretch;margin:0 3px;background:var(--hud-border)}
  .hint{flex-basis:100%;margin:4px 0 0;text-align:center;font-size:10.5px;letter-spacing:.08em;color:rgba(0,255,65,.55)}
  #toast{
    position:fixed;z-index:20;top:max(16px,env(safe-area-inset-top));left:50%;
    transform:translate(-50%,-10px);opacity:0;pointer-events:none;
    padding:9px 16px;border-radius:11px;background:var(--hud-bg);
    border:1px solid var(--hud-border);color:var(--ink);font-size:12.5px;letter-spacing:.08em;
    -webkit-backdrop-filter:var(--hud-blur);backdrop-filter:var(--hud-blur);
    transition:opacity .22s ease,transform .22s ease;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  noscript div{
    position:fixed;inset:auto 0 0 0;z-index:99;padding:12px;text-align:center;
    background:#100;color:var(--neon);font-size:13px;
  }
  @media (max-width:560px){
    .controls button{padding:7px 9px;font-size:11px}
    .hud .stats{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .controls button,#toast,.hud .brand .cursor{transition:none;animation:none}
  }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>

<header class="hud" aria-hidden="true">
  <div class="brand">MATRIX<span class="cursor">_</span></div>
  <div class="sub">黑客帝国 · 数字雨 DIGITAL RAIN</div>
  <div class="stats">FPS <b id="fps">60</b> · SPEED <b id="speedLabel">1×</b> · COLS <b id="colCount">0</b></div>
</header>

<div class="controls" role="toolbar" aria-label="数字雨控制台">
  <button type="button" class="speed" data-speed="0.25" aria-pressed="false">0.25×</button>
  <button type="button" class="speed" data-speed="0.5" aria-pressed="false">0.5×</button>
  <button type="button" class="speed" data-speed="1" aria-pressed="true">1×</button>
  <button type="button" class="speed" data-speed="2" aria-pressed="false">2×</button>
  <button type="button" class="speed" data-speed="4" aria-pressed="false">4×</button>
  <span class="divider" aria-hidden="true"></span>
  <button type="button" id="btnPause" aria-pressed="false">⏸ 暂停</button>
  <button type="button" id="btnReset" aria-label="重置雨幕">↻ 重置</button>
  <button type="button" id="btnFull" aria-label="切换全屏">⛶ 全屏</button>
  <p class="hint">🖱️ / 👆 点击画面产生字符涟漪 · [空格] 暂停 · [↑↓] 调速 · [R] 重置 · [F] 全屏</p>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<noscript><div>本页面需要启用 JavaScript 才能呈现数字雨动画。</div></noscript>

<script>
"use strict";
(() => {
  /* ============================================================
   * Matrix Digital Rain — 单文件零依赖实现
   * 模块划分：状态 / 雨幕引擎 / 涟漪系统 / 交互控制 / 主循环
   * ============================================================ */

  const canvas = document.getElementById("rain");
  const ctx = canvas.getContext("2d", { alpha: false });
  const $ = (id) => document.getElementById(id);
  const els = {
    fps: $("fps"),
    speed: $("speedLabel"),
    cols: $("colCount"),
    toast: $("toast"),
    pause: $("btnPause"),
    reset: $("btnReset"),
    full: $("btnFull"),
  };

  const FONT_STACK = '"Cascadia Code","JetBrains Mono",Consolas,"Courier New",ui-monospace,monospace';
  /* 半角片假名 + 数字 + 符号：经典 Matrix 字符集（全部为静态常量，无任何用户输入） */
  const GLYPHS = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789:･.=*+-<>¦";
  const SPEEDS = [0.25, 0.5, 1, 2, 4];
  const MAX_RIPPLES = 4;

  const state = {
    w: 0, h: 0, cell: 16,
    cols: [],            // 雨幕列
    ripples: [],         // 激活的涟漪
    headQueue: [],       // 本帧头部字符批绘制队列（复用，避免逐帧分配）
    speed: 1, paused: false, userPaused: false,
    fpsEMA: 60,
    lastRipple: { x: 0, y: 0, t: 0 },
  };

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const glyph = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

  /* ---------------- 轻提示（仅 textContent，杜绝 HTML 注入面） ---------------- */
  let toastTimer = 0;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1400);
  }

  /* ---------------- 雨幕引擎 ---------------- */
  function buildColumns() {
    const cell = state.cell;
    const n = Math.ceil(state.w / cell);
    const rows = Math.ceil(state.h / cell);
    state.cols.length = 0;
    for (let i = 0; i < n; i++) {
      const above = Math.random() < 0.5;
      const row = above ? -Math.random() * rows * 0.8 : Math.random() * rows;
      state.cols.push({
        x: i * cell + cell / 2,
        row: row,                 // 以“格”为单位的头部位置（可为负，屏幕上方）
        prev: Math.floor(row),    // 上一次已绘制的格
        speed: 6 + Math.random() * 9, // 格/秒 @1x
        kick: 0,                  // 涟漪冲击亮度 0..1
      });
    }
    els.cols.textContent = String(n);
  }

  function drawFlat(x, y, ch, alpha) {
    ctx.fillStyle = "rgba(0,255,65," + alpha.toFixed(3) + ")";
    ctx.fillText(ch, x, y);
  }

  /* 预热：首帧即呈现“已经下落很久”的雨幕，而不是空白渐入 */
  function prewarm() {
    const cell = state.cell;
    for (const c of state.cols) {
      const head = Math.floor(c.row);
      const trail = 4 + ((Math.random() * 14) | 0);
      for (let k = trail; k >= 1; k--) {
        drawFlat(c.x, (head - k) * cell + cell / 2, glyph(), 0.12 + 0.5 * (1 - k / trail));
      }
      drawFlat(c.x, head * cell + cell / 2, glyph(), 1);
    }
  }

  function resize() {
    const w = Math.max(200, window.innerWidth);
    const h = Math.max(200, window.innerHeight);
    const dpr = clamp(window.devicePixelRatio || 1, 1, 2); // DPR 上限 2：高分屏填充率防护
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    state.w = w; state.h = h;
    state.cell = clamp(Math.round(w / 100), 13, 24);
    ctx.font = state.cell + "px " + FONT_STACK;
    state.ripples.length = 0;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    buildColumns();
    prewarm();
  }

  function stepColumns(dt) {
    const cell = state.cell, h = state.h, q = state.headQueue;
    for (const c of state.cols) {
      if (c.kick > 0.001) c.kick *= Math.exp(-dt * 3.2);
      c.row += c.speed * state.speed * dt;
      const ri = Math.floor(c.row);
      if (ri !== c.prev) {
        const steps = Math.min(ri - c.prev, 6); // 单帧单列最多补 6 格，防止卡顿后爆发
        for (let k = 1; k <= steps; k++) {
          q.push({
            x: c.x, y: (c.prev + k) * cell + cell / 2,
            ch: glyph(),
            kick: c.kick,
            flash: Math.random() < 0.02,
          });
        }
        c.prev = ri;
      }
      if (c.row * cell > h + 60) { // 出屏后随机回收到顶部上方
        c.row = -(2 + Math.random() * 24);
        c.prev = Math.floor(c.row);
        c.speed = 6 + Math.random() * 9;
        c.kick = 0;
      }
    }
    /* 头部字符批绘制：共享一次 shadow 状态，显著降低状态切换开销 */
    if (q.length) {
      ctx.shadowColor = "rgba(0,255,65,0.85)";
      ctx.shadowBlur = 10;
      ctx.fillStyle = "#c9ffdf";
      for (let i = 0; i < q.length; i++) ctx.fillText(q[i].ch, q[i].x, q[i].y);
      ctx.shadowBlur = 0;
      for (let i = 0; i < q.length; i++) {
        const hd = q[i];
        if (hd.flash) {
          ctx.fillStyle = "#ffffff";
          ctx.fillText(hd.ch, hd.x, hd.y);
        } else if (hd.kick > 0.05) {
          ctx.fillStyle = "rgba(255,255,255," + (hd.kick * 0.9).toFixed(3) + ")";
          ctx.fillText(hd.ch, hd.x, hd.y);
        }
      }
      q.length = 0;
    }
  }

  /* ---------------- 涟漪系统：以字符构成的扩张波纹环 ---------------- */
  function spawnRipple(x, y) {
    const maxR = clamp(Math.min(state.w, state.h) * 0.55, 240, 720);
    state.ripples.push({ x: x, y: y, r: 0, maxR: maxR });
    if (state.ripples.length > MAX_RIPPLES) state.ripples.shift();
  }

  function stepRipples(dt) {
    const list = state.ripples;
    for (let i = list.length - 1; i >= 0; i--) {
      const R = list[i];
      R.r += (R.maxR / 0.95) * dt; // 约 0.95s 扩散至最大半径
      const t = R.r / R.maxR;
      if (t >= 1) { list.splice(i, 1); continue; }
      drawRipple(R, Math.pow(1 - t, 1.3));
    }
  }

  function drawRipple(R, alpha) {
    const w = state.w, h = state.h, cell = state.cell, cols = state.cols;
    /* 半透明波前弧线 */
    ctx.beginPath();
    ctx.strokeStyle = "rgba(0,255,65," + (0.22 * alpha).toFixed(3) + ")";
    ctx.lineWidth = 1.5;
    ctx.arc(R.x, R.y, R.r, 0, Math.PI * 2);
    ctx.stroke();

    if (R.r < cell * 0.7) return;
    /* 波纹字符环：对每一列求圆与列线的交点，网格吸附后绘制发光字符 */
    const glow = alpha > 0.35; // 仅高亮波前启用 shadow，控制填充率
    if (glow) { ctx.shadowColor = "rgba(0,255,65,0.9)"; ctx.shadowBlur = 16 * alpha; }
    ctx.fillStyle = "rgba(223,255,232," + (0.2 + 0.8 * alpha).toFixed(3) + ")";
    for (let i = 0; i < cols.length; i++) {
      const c = cols[i];
      const dx = c.x - R.x;
      const rem = R.r * R.r - dx * dx;
      if (rem <= 0) continue;
      const dy = Math.sqrt(rem);
      for (let s = -1; s <= 1; s += 2) {
        if (s === -1 && dy * 2 < cell * 0.9) continue; // 环顶/环底两交点重合，去重
        const y = R.y + s * dy;
        if (y < -cell || y > h + cell) continue;
        const gy = Math.round((y - cell / 2) / cell) * cell + cell / 2;
        ctx.fillText(glyph(), c.x, gy);
        /* 波前掠过下落头部 → 冲击点亮 */
        if (c.prev >= 0) {
          const hy = c.prev * cell + cell / 2;
          const dist = Math.hypot(dx, hy - R.y);
          if (Math.abs(dist - R.r) < cell * 0.9) c.kick = Math.max(c.kick, 1);
        }
      }
    }
    if (glow) ctx.shadowBlur = 0;
  }

  /* ---------------- 指针交互（鼠标 + 触摸统一 Pointer Events） ---------------- */
  function onPointerDown(e) {
    spawnRipple(e.clientX, e.clientY);
    state.lastRipple.x = e.clientX;
    state.lastRipple.y = e.clientY;
    state.lastRipple.t = performance.now();
  }
  function onPointerMove(e) {
    if (e.pointerType === "mouse" && e.buttons === 0) return; // 忽略未按下的悬停移动
    const now = performance.now();
    const lr = state.lastRipple;
    if (now - lr.t < 220) return; // 节流
    const dx = e.clientX - lr.x, dy = e.clientY - lr.y;
    if (dx * dx + dy * dy > 14400) { // 拖拽超过 120px 产生新涟漪 → 划出波痕
      spawnRipple(e.clientX, e.clientY);
      lr.x = e.clientX; lr.y = e.clientY; lr.t = now;
    }
  }
  canvas.addEventListener("pointerdown", onPointerDown, { passive: true });
  canvas.addEventListener("pointermove", onPointerMove, { passive: true });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  /* ---------------- 控制台：速度 / 暂停 / 重置 / 全屏 ---------------- */
  function setSpeed(v) {
    state.speed = v;
    els.speed.textContent = v + "×";
    const btns = document.querySelectorAll("button[data-speed]");
    for (let i = 0; i < btns.length; i++) {
      const b = btns[i];
      const on = parseFloat(b.getAttribute("data-speed")) === v;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    }
  }
  function setPausedVisual(v) {
    state.paused = v;
    els.pause.textContent = v ? "▶ 继续" : "⏸ 暂停";
    els.pause.setAttribute("aria-pressed", v ? "true" : "false");
  }
  function togglePauseByUser() {
    state.userPaused = !state.userPaused;
    setPausedVisual(state.userPaused);
    toast(state.userPaused ? "已暂停 · 空格继续" : "雨幕继续");
  }
  function resetRain() {
    state.ripples.length = 0;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, state.w, state.h);
    buildColumns();
    prewarm();
    toast("雨幕已重置");
  }
  function toggleFullscreen() {
    try {
      if (document.fullscreenElement) {
        const p = document.exitFullscreen();
        if (p && p.catch) p.catch(() => toast("退出全屏失败"));
      } else {
        const p = document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(() => toast("当前环境不支持全屏"));
      }
    } catch (err) {
      toast("当前环境不支持全屏");
    }
  }
  function bumpSpeed(dir) {
    const i = SPEEDS.indexOf(state.speed);
    const ni = clamp(i + dir, 0, SPEEDS.length - 1);
    if (ni !== i) { setSpeed(SPEEDS[ni]); toast("速度 " + SPEEDS[ni] + "×"); }
  }

  const speedBtns = document.querySelectorAll("button[data-speed]");
  for (let i = 0; i < speedBtns.length; i++) {
    const b = speedBtns[i];
    b.addEventListener("click", () => setSpeed(parseFloat(b.getAttribute("data-speed"))));
  }
  els.pause.addEventListener("click", togglePauseByUser);
  els.reset.addEventListener("click", resetRain);
  els.full.addEventListener("click", toggleFullscreen);

  window.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    const k = e.key;
    if ((k === " " || k === "Enter") && e.target && e.target.tagName === "BUTTON") return; // 避免按钮聚焦时双重触发
    if (k === " ") { e.preventDefault(); togglePauseByUser(); }
    else if (k === "ArrowUp") { e.preventDefault(); bumpSpeed(1); }
    else if (k === "ArrowDown") { e.preventDefault(); bumpSpeed(-1); }
    else if (k === "r" || k === "R") resetRain();
    else if (k === "f" || k === "F") toggleFullscreen();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) setPausedVisual(true);
    else if (!state.userPaused) setPausedVisual(false);
  });

  let resizeQueued = false;
  window.addEventListener("resize", () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; resize(); });
  });

  /* ---------------- 主循环（dt 驱动，速度无关帧率） ---------------- */
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0.016;
    if (dt > 0.05) dt = 0.05; // 切后台/卡顿钳制
    state.fpsEMA += (1 / dt - state.fpsEMA) * 0.06;
    if (!state.paused) {
      const fade = Math.min(0.22, 0.075 + 0.035 * state.speed); // 速度越快残影越短
      ctx.fillStyle = "rgba(0,0,0," + fade.toFixed(3) + ")";
      ctx.fillRect(0, 0, state.w, state.h);
      stepColumns(dt);
      stepRipples(dt);
    }
  }
  setInterval(() => { els.fps.textContent = String(Math.round(state.fpsEMA)); }, 300);

  /* ---------------- 启动 ---------------- */
  resize();
  setSpeed(1);
  setPausedVisual(false);
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    state.userPaused = true;
    setPausedVisual(true);
    toast("已按系统「减弱动态效果」偏好暂停");
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
