<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博木鱼 2077：神经元粒子声学工作台</title>
    <style>
        /* ========== CSS VARIABLES THEME ========== */
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-panel: rgba(15, 15, 25, 0.95);
            --neon-cyan: #00f5ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff88;
            --neon-orange: #ff6600;
            --neon-purple: #8b00ff;
            --text-primary: #e0e0e0;
            --text-secondary: #8888aa;
            --glow-cyan: 0 0 20px rgba(0, 245, 255, 0.5);
            --glow-pink: 0 0 20px rgba(255, 0, 255, 0.5);
            --glow-green: 0 0 20px rgba(0, 255, 136, 0.5);
            --muyu-size: min(300px, 60vw);
            --panel-radius: 12px;
            --neon-gold: #ffd700;
            --glow-gold: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'SF Mono', 'Consolas', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            cursor: crosshair;
        }

        /* ========== MAIN CANVAS LAYERS ========== */
        #neuronCanvas, #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #neuronCanvas { z-index: 0; }
        #particleCanvas { z-index: 2; }

        /* ========== HEADER ========== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(180deg, rgba(10, 10, 15, 0.95) 0%, transparent 100%);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: var(--glow-cyan);
            letter-spacing: 2px;
        }

        .logo span {
            font-size: 0.7rem;
            opacity: 0.7;
            -webkit-text-fill-color: var(--text-secondary);
            display: block;
        }

        .bpm-display {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--neon-green);
            text-shadow: var(--glow-green);
        }

        .bpm-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* ========== MUYU CONTAINER ========== */
        .muyu-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .muyu-wrapper {
            position: relative;
            width: var(--muyu-size);
            height: var(--muyu-size);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ========== MUYU SVG ========== */
        .muyu-body {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px rgba(0, 245, 255, 0.4));
            transition: filter 0.1s ease;
        }

        .muyu-body.hit {
            filter: drop-shadow(0 0 60px rgba(255, 0, 255, 0.8)) drop-shadow(0 0 100px rgba(0, 245, 255, 0.6));
            transform: scale(0.95);
        }

        .muyu-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            opacity: 0;
            animation: ringExpand 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes ringExpand {
            0% { width: 80%; height: 80%; opacity: 0.8; }
            100% { width: 250%; height: 250%; opacity: 0; }
        }

        /* ========== HIT COUNTER ========== */
        .hit-counter {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .hit-count {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hit-label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .auto-chao-label-display {
            margin-top: 8px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--neon-gold);
            text-shadow: 0 0 6px var(--neon-gold), 0 0 14px rgba(255, 215, 0, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        /* ========== MERIT CYBER GLOW ========== */
        .hit-counter {
            position: relative;
        }

        .merit-glow-orb {
            position: absolute;
            top: 50%;
            right: -26px;
            width: 12px;
            height: 12px;
            transform: translateY(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, var(--neon-green) 0%, var(--neon-cyan) 60%, transparent 100%);
            box-shadow: 0 0 6px var(--neon-green), 0 0 14px var(--neon-cyan), 0 0 28px rgba(0, 255, 65, 0.6);
            animation: orbBreath 2.4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes orbBreath {
            0%, 100% { opacity: 0.55; transform: translateY(-50%) scale(1); }
            50%      { opacity: 1;    transform: translateY(-50%) scale(1.35); }
        }

        .merit-glow-orb.gold {
            background: radial-gradient(circle, var(--neon-gold) 0%, var(--neon-orange) 60%, transparent 100%);
            box-shadow: 0 0 8px var(--neon-gold), 0 0 18px var(--neon-orange), 0 0 32px rgba(255, 215, 0, 0.7);
        }

        .counter-flash {
            animation: counterPulse 0.45s ease-out;
        }

        @keyframes counterPulse {
            0% {
                text-shadow: 0 0 4px var(--neon-cyan), 0 0 10px var(--neon-cyan),
                             0 0 22px var(--neon-green), 0 0 40px rgba(0, 255, 65, 0.8);
                filter: brightness(1.6);
            }
            100% { text-shadow: none; filter: brightness(1); }
        }

        .merit-float {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--neon-gold);
            text-shadow: 0 0 6px var(--neon-gold), 0 0 14px rgba(255, 215, 0, 0.7);
            animation: meritRise 0.9s ease-out forwards;
            pointer-events: none;
            white-space: nowrap;
        }

        .gold-merit-float {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            font-weight: bold;
            color: var(--neon-gold);
            text-shadow: 0 0 8px var(--neon-gold), 0 0 18px rgba(255, 215, 0, 0.8);
            animation: goldMeritRise 1.2s ease-out forwards;
            pointer-events: none;
            white-space: nowrap;
        }

        .merit-float-auto {
            position: absolute;
            font-size: 1rem;
            font-weight: bold;
            color: var(--neon-gold);
            text-shadow: 0 0 10px var(--neon-gold), 0 0 22px rgba(255, 215, 0, 0.9);
            animation: goldMeritRise 1.4s ease-out forwards;
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes meritRise {
            0%   { opacity: 0; transform: translate(-50%, 8px) scale(0.85); }
            25%  { opacity: 1; transform: translate(-50%, -4px) scale(1.05); }
            100% { opacity: 0; transform: translate(-50%, -26px) scale(1); }
        }


        @keyframes goldMeritRise {
            0%   { opacity: 0; transform: translate(-50%, 12px) scale(0.8); }
            20%  { opacity: 1; transform: translate(-50%, -6px) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -40px) scale(1.2); }
        }
        /* ========== GOLD MERIT FLOAT ========== */
        .merit-float-gold {
            position: fixed;
            left: 50vw;
            top: 60vh;
            color: #ffd700;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.5);
            pointer-events: none;
            z-index: 1000;
            opacity: 1;
            transform: translateY(0) translateX(0) scale(1);
            transition: all 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ========== CONTROL PANEL ========== */
        .panel {
            position: fixed;
            background: var(--bg-panel);
            border: 1px solid rgba(0, 245, 255, 0.2);
            border-radius: var(--panel-radius);
            backdrop-filter: blur(10px);
            z-index: 50;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .panel:hover {
            border-color: rgba(0, 245, 255, 0.5);
            box-shadow: var(--glow-cyan);
        }

        .panel-title {
            font-size: 0.7rem;
            color: var(--neon-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 245, 255, 0.2);
        }

        /* ========== LEFT PANEL - SOUND ENGINE ========== */
        .panel-left {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .control-value {
            color: var(--neon-green);
            font-weight: bold;
        }

        /* ========== CUSTOM SLIDER ========== */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            border-radius: 2px;
            outline: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        input[type="range"]:hover { opacity: 1; }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--neon-cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--glow-cyan);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--neon-cyan);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: var(--glow-cyan);
        }

        /* ========== RIGHT PANEL - BEAT CONTROL ========== */
        .panel-right {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
        }

        .beat-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: transparent;
            border: 1px solid var(--neon-pink);
            border-radius: 6px;
            color: var(--neon-pink);
            font-family: inherit;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .beat-btn:hover {
            background: rgba(255, 0, 255, 0.1);
            box-shadow: var(--glow-pink);
        }

        .beat-btn.active {
            background: var(--neon-pink);
            color: var(--bg-primary);
        }

        /* ========== AUTO-CHAO SWITCH ========== */
        .auto-chao-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
        }

        .auto-chao-label {
            font-size: 0.8rem;
            color: var(--neon-gold);
            text-shadow: 0 0 6px var(--neon-gold);
        }

        .auto-chao-switch {
            position: relative;
            width: 50px;
            height: 24px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .auto-chao-switch.active {
            background: var(--neon-gold);
            box-shadow: var(--glow-gold);
        }

        .auto-chao-switch::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .auto-chao-switch.active::before {
            left: 29px;
            background: var(--bg-primary);
        }


        .muyu-body.auto-chao-active {
            filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.6));
            animation: autoChaoPulse 2s ease-in-out infinite;
        }

        @keyframes autoChaoPulse {
            0%, 100% { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.4)); }
            50% { filter: drop-shadow(0 0 60px rgba(255, 215, 0, 0.8)); }
        }
        .beat-pattern {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        .beat-dot {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(0, 245, 255, 0.2);
            border: 1px solid var(--neon-cyan);
            cursor: pointer;
            transition: all 0.2s;
        }

        .beat-dot.active {
            background: var(--neon-cyan);
            box-shadow: var(--glow-cyan);
        }

        .beat-dot.current {
            transform: scale(1.2);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* ========== BOTTOM PANEL - VISUALIZER ========== */
        .panel-bottom {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: min(500px, 90vw);
            padding: 15px 20px;
        }

        .visualizer-bar {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            height: 50px;
        }

        .viz-bar {
            width: 4px;
            background: linear-gradient(180deg, var(--neon-pink), var(--neon-cyan));
            border-radius: 2px;
            transition: height 0.05s ease;
            min-height: 4px;
        }

        /* ========== BOTTOM RIGHT - PRESETS ========== */
        .panel-bottom-right {
            bottom: 20px;
            right: 20px;
            width: 180px;
        }

        .preset-btn {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: transparent;
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 4px;
            color: var(--neon-green);
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .preset-btn:hover {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--neon-green);
        }

        .preset-btn.active {
            background: rgba(0, 255, 136, 0.2);
            border-color: var(--neon-green);
        }

        /* ========== BOTTOM LEFT - STATS ========== */
        .panel-bottom-left {
            bottom: 20px;
            left: 20px;
            width: 160px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 0.7rem;
        }

        .stat-label { color: var(--text-secondary); }

        .stat-value {
            color: var(--neon-orange);
            font-weight: bold;
        }

        /* ========== KEYBOARD HINT ========== */
        .keyboard-hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: var(--text-secondary);
            opacity: 0.5;
            z-index: 5;
            text-align: center;
        }

        .key {
            display: inline-block;
            padding: 2px 8px;
            margin: 0 3px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            font-size: 0.6rem;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 900px) {
            .panel-left, .panel-right {
                position: fixed;
                top: auto;
                bottom: 100px;
                transform: none;
                width: 150px;
            }
            .panel-left { left: 10px; }
            .panel-right { right: 10px; }
            .panel-bottom-left, .panel-bottom-right { display: none; }
            :root { --muyu-size: min(250px, 70vw); }
        }

        @media (max-width: 600px) {
            .panel-left, .panel-right {
                width: 130px;
                padding: 10px;
            }
            .hit-count { font-size: 2rem; }
            .keyboard-hint { display: none; }
        }

        /* ========== ANIMATIONS ========== */
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .pulse { animation: pulse 2s infinite; }

        /* ========== LOADING STATE ========== */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            animation: pulse 1s infinite;
            margin-bottom: 20px;
        }

        .loading-bar {
            width: 200px;
            height: 2px;
            background: rgba(0, 245, 255, 0.2);
            border-radius: 1px;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: var(--neon-cyan);
            width: 0%;
            animation: loadProgress 1s ease-out forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-text">▶ 初始化声学引擎...</div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <!-- Canvas Layers -->
    <canvas id="neuronCanvas"></canvas>
    <canvas id="particleCanvas"></canvas>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            赛博木鱼 2077
            <span>NEURON PARTICLE ACOUSTIC WORKBENCH</span>
        </div>
        <div class="bpm-display">
            <span>BPM</span>
            <span class="bpm-value" id="bpmDisplay">--</span>
        </div>
    </header>

    <!-- Muyu Core -->
    <div class="muyu-container" id="muyuContainer">
        <div class="muyu-wrapper" id="muyuWrapper">
            <svg class="muyu-body" id="muyuBody" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f5ff"/>
                        <stop offset="50%" stop-color="#ff00ff"/>
                        <stop offset="100%" stop-color="#00ff88"/>
                    </linearGradient>
                    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1e1e32"/>
                        <stop offset="50%" stop-color="#12121f"/>
                        <stop offset="100%" stop-color="#08080f"/>
                    </linearGradient>
                    <linearGradient id="mouthGlow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="rgba(0,245,255,0.2)"/>
                        <stop offset="50%" stop-color="rgba(0,245,255,0.95)"/>
                        <stop offset="100%" stop-color="rgba(0,245,255,0.2)"/>
                    </linearGradient>
                    <radialGradient id="corePulse" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#00f5ff" stop-opacity="1"/>
                        <stop offset="40%" stop-color="#8b00ff" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
                    </radialGradient>
                    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Background Tech Rings -->
                <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(0,245,255,0.2)" stroke-width="1" stroke-dasharray="6 10"/>
                <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(255,0,255,0.15)" stroke-width="1" stroke-dasharray="40 20"/>

                <!-- HUD Alignment Marks -->
                <line x1="100" y1="5" x2="100" y2="12" stroke="#00f5ff" stroke-width="2" opacity="0.6"/>
                <line x1="100" y1="188" x2="100" y2="195" stroke="#00f5ff" stroke-width="2" opacity="0.6"/>
                <line x1="5" y1="100" x2="12" y2="100" stroke="#00f5ff" stroke-width="2" opacity="0.6"/>
                <line x1="188" y1="100" x2="195" y2="100" stroke="#00f5ff" stroke-width="2" opacity="0.6"/>

                <!-- Wooden Fish Main Carapace -->
                <path d="M 100 28 C 142 28, 172 58, 172 105 C 172 142, 142 166, 100 166 C 58 166, 28 142, 28 105 C 28 58, 58 28, 100 28 Z" 
                      fill="url(#bodyGrad)" 
                      stroke="url(#cyberBorder)" 
                      stroke-width="2.5"/>

                <!-- Dorsal Spine / Tech Crest -->
                <path d="M 88 32 L 100 18 L 112 32 L 108 48 L 92 48 Z" 
                      fill="#181828" 
                      stroke="#00f5ff" 
                      stroke-width="1.5"/>
                <line x1="100" y1="20" x2="100" y2="44" stroke="#ff00ff" stroke-width="1.5" opacity="0.8"/>

                <!-- Acoustic Slit / Carved Mouth (木鱼音裂/鱼嘴) -->
                <path d="M 45 116 Q 100 136 155 116 Q 135 106 100 110 Q 65 106 45 116 Z" 
                      fill="#0a0a14" 
                      stroke="rgba(255,0,255,0.6)" 
                      stroke-width="1.2"/>
                <path d="M 52 115 Q 100 133 148 115" 
                      fill="none" 
                      stroke="url(#mouthGlow)"

    <script>
        // ========== SECURITY: XSS SANITIZER ==========
        const SecurityUtils = {
            sanitize(str) {
                if (typeof str !== 'string') return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            },
            validateNumber(val, min, max) {
                const num = parseInt(val, 10);
                return isNaN(num) ? min : Math.max(min, Math.min(max, num));
            }
        };

        // ========== AUDIO ENGINE ==========
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.convolver = null;
                this.initialized = false;
                this.muted = false;
                this.params = { frequency: 440, tone: 50, reverb: 30, decay: 500 };
            }

            async init() {
                if (this.initialized) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = 0.5;
                    this.masterGain.connect(this.ctx.destination);

                    this.convolver = this.ctx.createConvolver();
                    this.convolver.buffer = this.createReverbImpulse();

                    this.reverbGain = this.ctx.createGain();
                    this.reverbGain.gain.value = this.params.reverb / 100;
                    this.convolver.connect(this.reverbGain);
                    this.reverbGain.connect(this.masterGain);

                    this.dryGain = this.ctx.createGain();
                    this.dryGain.gain.value = 1 - (this.params.reverb / 200);
                    this.dryGain.connect(this.masterGain);

                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 64;
                    this.masterGain.connect(this.analyser);

                    this.initialized = true;
                } catch (e) {
                    console.error('Audio init failed:', e);
                }
            }

            createReverbImpulse() {
                const sampleRate = this.ctx.sampleRate;
                const length = sampleRate * 2;
                const impulse = this.ctx.createBuffer(2, length, sampleRate);
                for (let channel = 0; channel < 2; channel++) {
                    const data = impulse.getChannelData(channel);
                    for (let i = 0; i < length; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / sampleRate * 3) * 0.5;
                    }
                }
                return impulse;
            }

            updateParams(params) {
                Object.assign(this.params, params);
                if (this.initialized) {
                    this.reverbGain.gain.value = this.params.reverb / 100;
                    this.dryGain.gain.value = 1 - (this.params.reverb / 200);
                }
            }

            playMuyu(velocity = 1) {
                if (!this.initialized || this.muted) return;
                const now = this.ctx.currentTime;
                const freq = this.params.frequency;
                const tone = this.params.tone / 100;
                const decay = this.params.decay / 1000;

                const osc1 = this.ctx.createOscillator();
                osc1.type = 'sine';
                osc1.frequency.value = freq;

                const osc2 = this.ctx.createOscillator();
                osc2.type = 'triangle';
                osc2.frequency.value = freq * 0.5;

                const osc3 = this.ctx.createOscillator();
                osc3.type = 'sine';
                osc3.frequency.value = freq * 2;

                const gain1 = this.ctx.createGain();
                const gain2 = this.ctx.createGain();
                const gain3 = this.ctx.createGain();

                const peakGain = 0.4 * velocity;
                gain1.gain.setValueAtTime(0, now);
                gain1.gain.linearRampToValueAtTime(peakGain * (1 - tone * 0.3), now + 0.005);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + decay);

                gain2.gain.setValueAtTime(0, now);
                gain2.gain.linearRampToValueAtTime(peakGain * tone * 0.5, now + 0.005);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + decay * 1.2);

                gain3.gain.setValueAtTime(0, now);
                gain3.gain.linearRampToValueAtTime(peakGain * 0.15, now + 0.005);
                gain3.gain.exponentialRampToValueAtTime(0.001, now + decay * 0.4);

                osc1.connect(gain1);
                osc2.connect(gain2);
                osc3.connect(gain3);

                gain1.connect(this.dryGain);
                gain1.connect(this.convolver);
                gain2.connect(this.dryGain);
                gain2.connect(this.convolver);
                gain3.connect(this.dryGain);

                osc1.start(now);
                osc2.start(now);
                osc3.start(now);

                const stopTime = now + decay + 0.1;
                osc1.stop(stopTime);
                osc2.stop(stopTime);
                osc3.stop(stopTime);

                return { timestamp: now, frequency: freq, velocity };
            }

            getAnalyserData() {
                if (!this.analyser) return new Uint8Array(32).fill(0);
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                return data;
            }

            toggleMute() {
                this.muted = !this.muted;
                if (this.masterGain) {
                    this.masterGain.gain.value = this.muted ? 0 : 0.5;
                }
                return this.muted;
            }
        }

        // ========== PARTICLE SYSTEM ==========
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            emit(x, y, count = 30) {
                const colors = [
                    'rgba(0, 245, 255, ',
                    'rgba(255, 0, 255, ',
                    'rgba(0, 255, 136, ',
                    'rgba(139, 0, 255, '
                ];

                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                    const speed = 2 + Math.random() * 6;

                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        decay: 0.015 + Math.random() * 0.02,
                        size: 2 + Math.random() * 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        trail: []
                    });
                }
            }

            emitRing(x, y) {
                for (let i = 0; i < 40; i++) {
                    const angle = (Math.PI * 2 * i) / 40;
                    this.particles.push({
                        x: x + Math.cos(angle) * 20,
                        y: y + Math.sin(angle) * 20,
                        vx: Math.cos(angle) * (3 + Math.random() * 2),
                        vy: Math.sin(angle) * (3 + Math.random() * 2),
                        life: 1,
                        decay: 0.02,
                        size: 3,
                        color: 'rgba(0, 245, 255, ',
                        trail: []
                    });
                }
            }

            update() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.trail.push({ x: p.x, y: p.y });
                    if (p.trail.length > 5) p.trail.shift();

                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.98;
                    p.vy *= 0.98;
                    p.vy += 0.02;
                    p.life -= p.decay;

                    if (p.trail.length > 1) {
                        this.ctx.beginPath();
                        this.ctx.moveTo(p.trail[0].x, p.trail[0].y);
                        for (let j = 1; j < p.trail.length; j++) {
                            this.ctx.lineTo(p.trail[j].x, p.trail[j].y);
                        }
                        this.ctx.strokeStyle = p.color + (p.life * 0.3) + ')';
                        this.ctx.lineWidth = p.size * 0.5;
                        this.ctx.stroke();
                    }

                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color + p.life + ')';
                    this.ctx.fill();

                    if (p.life <= 0) this.particles.splice(i, 1);
                }
            }

            getCount() { return this.particles.length; }
        }

        // ========== NEURON NETWORK ==========
        class NeuronNetwork {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.nodes = [];
                this.intensity = 0;
                this.resize();
                this.initNodes();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.initNodes();
            }

            initNodes() {
                this.nodes = [];
                const count = Math.min(Math.floor((this.canvas.width * this.canvas.height) / 25000), 50);

                for (let i = 0; i < count; i++) {
                    this.nodes.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        radius: 2 + Math.random() * 2,
                        phase: Math.random() * Math.PI * 2,
                        activity: 0
                    });
                }
            }

            pulse(intensity = 1) {
                this.intensity = Math.min(this.intensity + intensity, 3);
                for (let i = 0; i < Math.floor(this.nodes.length * 0.3); i++) {
                    this.nodes[Math.floor(Math.random() * this.nodes.length)].activity = 1;
                }
            }

            update() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (const node of this.nodes) {
                    node.x += node.vx;
                    node.y += node.vy;
                    node.phase += 0.02;
                    node.activity *= 0.95;

                    if (node.x < 0 || node.x > this.canvas.width) node.vx *= -1;
                    if (node.y < 0 || node.y > this.canvas.height) node.vy *= -1;
                    node.x = Math.max(0, Math.min(this.canvas.width, node.x));
                    node.y = Math.max(0, Math.min(this.canvas.height, node.y));
                }

                const connectionDistance = 150 + this.intensity * 30;
                this.ctx.lineWidth = 0.5;

                for (let i = 0; i < this.nodes.length; i++) {
                    for (let j = i + 1; j < this.nodes.length; j++) {
                        const dx = this.nodes[j].x - this.nodes[i].x;
                        const dy = this.nodes[j].y - this.nodes[i].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < connectionDistance) {
                            const alpha = (1 - dist / connectionDistance) * 0.3;
                            const activity = Math.max(this.nodes[i].activity, this.nodes[j].activity);

                            this.ctx.strokeStyle = activity > 0.1
                                ? `rgba(0, 245, 255, ${alpha + activity * 0.5})`
                                : `rgba(0, 245, 255, ${alpha * 0.3})`;
                            this.ctx.lineWidth = activity > 0.1 ? 1 + activity : 0.5;

                            this.ctx.beginPath();
                            this.ctx.moveTo(this.nodes[i].x, this.nodes[i].y);
                            this.ctx.lineTo(this.nodes[j].x, this.nodes[j].y);
                            this.ctx.stroke();
                        }
                    }
                }

                for (const node of this.nodes) {
                    const baseAlpha = 0.3 + Math.sin(node.phase) * 0.1;
                    const activityAlpha = node.activity * 0.7;

                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, node.radius * 3, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(0, 245, 255, ${activityAlpha * 0.2})`;
                    this.ctx.fill();

                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(0, 245, 255, ${baseAlpha + activityAlpha})`;
                    this.ctx.fill();
                }

                this.intensity *= 0.98;
            }
        }

        // ========== VISUALIZER ==========
        class Visualizer {
            constructor(container, barCount = 32) {
                this.container = container;
                this.bars = [];
                this.init(barCount);
            }

            init(count) {
                this.container.innerHTML = '';
                for (let i = 0; i < count; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'viz-bar';
                    bar.style.height = '4px';
                    this.container.appendChild(bar);
                    this.bars.push(bar);
                }
            }

            update(data) {
                const step = Math.max(1, Math.floor(data.length / this.bars.length));
                for (let i = 0; i < this.bars.length; i++) {
                    const value = data[i * step] || 0;
                    this.bars[i].style.height = Math.max(4, (value / 255) * 50) + 'px';
                }
            }
        }

// ========== AUTO-CHANT STATE MACHINE ==========
class AutoChantState {
    constructor() {
        this.states = {
            IDLE: 'idle',
            CHANTING: 'chanting',
            PAUSED: 'paused'
        };
        this.currentState = this.states.IDLE;
        this.intensity = 1;
        this.maxIntensity = 5;
        this.chantCount = 0;
        this.intervalMin = 800;
        this.intervalMax = 2000;
        this.currentInterval = 1500;
        this.lastChantTime = 0;
        this.goldParticles = [];
        this.dynamicFreqOffset = 0;
        this.listeners = new Map();
        this.animationFrameId = null;
        this.chantTimerId = null;
    }

    transition(newState) {
        if (this.currentState === newState) return false;
        const oldState = this.currentState;
        this.currentState = newState;
        this.emit('stateChange', { from: oldState, to: newState });
        return true;
    }

    on(event, callback) {
        if (!this.listeners.has(event)) {
            this.listeners.set(event, new Set());
        }
        this.listeners.get(event).add(callback);
        return () => this.listeners.get(event)?.delete(callback);
    }

    emit(event, data) {
        const callbacks = this.listeners.get(event);
        if (callbacks) {
            callbacks.forEach(cb => cb(data));
        }
    }

    calculateInterval() {
        const baseInterval = this.intervalMin + 
            (this.intervalMax - this.intervalMin) * (1 - this.intensity / this.maxIntensity);
        const jitter = (Math.random() - 0.5) * 200;
        return Math.max(400, baseInterval + jitter);
    }

    calculateDynamicFreq(baseFreq) {
        const variation = Math.sin(this.chantCount * 0.1) * 20 + 
                         (Math.random() - 0.5) * 10;
        return Math.max(80, Math.min(880, baseFreq + variation));
    }

    calculateVelocity() {
        return Math.min(0.6 + this.intensity * 0.15, 1.5);
    }

    incrementIntensity() {
        this.intensity = Math.min(this.intensity + 0.05, this.maxIntensity);
    }

    reset() {
        this.intensity = 1;
        this.chantCount = 0;
        this.dynamicFreqOffset = 0;
    }

    cleanup() {
        this.listeners.clear();
        if (this.animationFrameId) {
            cancelAnimationFrame(this.animationFrameId);
            this.animationFrameId = null;
        }
        if (this.chantTimerId) {
            clearTimeout(this.chantTimerId);
            this.chantTimerId = null;
        }
    }
}

// ========== GOLD MERIT PARTICLE SYSTEM ==========
class GoldMeritSystem {
    constructor(container) {
        this.container = container;
        this.particles = [];
        this.isAnimating = false;
        this.frameId = null;
    }

    spawn(x, y, text = '+1 功德') {
        const merit = document.createElement('div');
        merit.className = 'merit-float-gold';
        merit.textContent = text;
        
        const startX = x || (Math.random() * 80 + 10);
        const startY = y || (Math.random() * 30 + 60);
        const driftX = (Math.random() - 0.5) * 150;
        const duration = 2000 + Math.random() * 1000;
        
        merit.style.cssText = `
            position: fixed;
            left: ${startX}vw;
            top: ${startY}vh;
            color: #ffd700;
            font-size: ${1 + Math.random() * 0.5}rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.5);
            pointer-events: none;
            z-index: 1000;
            opacity: 1;
            transform: translateY(0) translateX(0) scale(1);
            transition: all ${duration}ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
        `;
        
        this.container.appendChild(merit);
        
        requestAnimationFrame(() => {
            merit.style.transform = `translateY(-${100 + Math.random() * 100}px) translateX(${driftX}px) scale(0.5)`;
            merit.style.opacity = '0';
        });
        
        setTimeout(() => {
            merit.remove();
        }, duration);
        
        this.particles.push({ element: merit, spawnTime: Date.now() });
    }

    spawnMultiple(count = 3) {
        for (let i = 0; i < count; i++) {
            setTimeout(() => this.spawn(), i * 150);
        }
    }

    cleanup() {
        this.particles.forEach(p => {
            if (p.element && p.element.parentNode) {
                p.element.remove();
            }
        });
        this.particles = [];
        if (this.frameId) {
            cancelAnimationFrame(this.frameId);
            this.frameId = null;
        }
    }
}
        class CyberMuyu2077 {
            constructor() {
                this.audio = new AudioEngine();
                this.particles = new ParticleSystem(document.getElementById('particleCanvas'));
                this.neurons = new NeuronNetwork(document.getElementById('neuronCanvas'));
                this.visualizer = new Visualizer(document.getElementById('visualizerBar'));
                this.autoChant = new AutoChantState();
                this.goldMerit = new GoldMeritSystem(document.body);

                this.state = {
                    hitCount: 0,
                    combo: 0,
                    lastHitTime: 0,
                    autoBeat: false,
                    autoChantEnabled: false,
                    beatPattern: [1, 0, 1, 0, 1, 0, 1, 0],
                    currentBeat: 0,
                    bpm: 120,
                    sessionStart: Date.now(),
                    totalClicks: 0,
                    autoBeatTimer: 0
                };

                this.setupAutoChantListeners();
                this.loadState();
                this.bindEvents();
                this.animate();
            }

            setupAutoChantListeners() {
                this.autoChant.on('stateChange', ({ from, to }) => {
                    console.log(`AutoChant: ${from} -> ${to}`);
                    if (to === 'idle') {
                        this.updateAutoChantUI(false);
                    } else if (to === 'chanting') {
                        this.updateAutoChantUI(true);
                    }
                });
            }

            updateAutoChantUI(enabled) {
                const switchEl = document.getElementById('autoChaoSwitch');
                if (switchEl) {
                    switchEl.classList.toggle('active', enabled);
                }
                const labelEl = document.getElementById('autoChaoLabelDisplay');
                if (labelEl) {
                    labelEl.style.display = enabled ? 'block' : 'none';
                }
                const muyuBody = document.getElementById('muyuBody');
                if (muyuBody) {
                    muyuBody.classList.toggle('auto-chao-active', enabled);
                }
                document.getElementById('bpmDisplay').textContent = 
                    enabled ? this.state.bpm : (this.state.autoBeat ? this.state.bpm : '--');
            }

            toggleAutoChant() {
                if (!this.state.autoChantEnabled) {
                    this.state.autoChantEnabled = true;
                    this.autoChant.transition(this.autoChant.states.CHANTING);
                    this.autoChant.reset();
                    this.startAutoChantLoop();
                } else {
                    this.state.autoChantEnabled = false;
                    this.autoChant.transition(this.autoChant.states.IDLE);
                    this.autoChant.reset();
                    if (this.autoChant.chantTimerId) {
                        clearTimeout(this.autoChant.chantTimerId);
                        this.autoChant.chantTimerId = null;
                    }
                }
                this.saveState();
            }

            startAutoChantLoop() {
                if (!this.state.autoChantEnabled) return;

                const interval = this.autoChant.calculateInterval();
                this.autoChant.chantTimerId = setTimeout(() => {
                    if (this.state.autoChantEnabled) {
                        this.executeAutoChant();
                        this.startAutoChantLoop();
                    }
                }, interval);
            }

            async executeAutoChant() {
                if (this.autoChant.currentState !== 'chanting') return;

                await this.audio.init();

                const rect = document.getElementById('muyuWrapper').getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const velocity = this.autoChant.calculateVelocity();

                this.audio.playMuyu(velocity);
                this.triggerVisualHit(centerX, centerY, velocity);

                this.autoChant.chantCount++;
                this.autoChant.incrementIntensity();
                this.autoChant.lastChantTime = Date.now();

                this.state.hitCount++;
                this.state.totalClicks++;
                this.state.combo = this.autoChant.chantCount;
                document.getElementById('hitCount').textContent = this.state.hitCount.toLocaleString();
                document.getElementById('combo').textContent = this.state.combo;
                this.triggerCounterGlow();

                this.goldMerit.spawnMultiple(Math.min(3, Math.floor(1 + this.autoChant.intensity / 2)));

                if (this.state.hitCount % 10 === 0) this.saveState();
            }

            bindEvents() {
                const muyuContainer = document.getElementById('muyuContainer');
                muyuContainer.addEventListener('click', (e) => this.handleHit(e));
                muyuContainer.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.handleHit(e.touches[0]);
                }, { passive: false });

                document.addEventListener('keydown', (e) => this.handleKeyboard(e));

                document.getElementById('frequency').addEventListener('input', (e) => {
                    this.audio.updateParams({ frequency: SecurityUtils.validateNumber(e.target.value, 80, 880) });
                    document.getElementById('freqValue').textContent = e.target.value + 'Hz';
                    this.saveState();
                });

                document.getElementById('tone').addEventListener('input', (e) => {
                    this.audio.updateParams({ tone: SecurityUtils.validateNumber(e.target.value, 0, 100) });
                    document.getElementById('toneValue').textContent = e.target.value + '%';
                    this.saveState();
                });

                document.getElementById('reverb').addEventListener('input', (e) => {
                    this.audio.updateParams({ reverb: SecurityUtils.validateNumber(e.target.value, 0, 100) });
                    document.getElementById('reverbValue').textContent = e.target.value + '%';
                    this.saveState();
                });

                document.getElementById('decay').addEventListener('input', (e) => {
                    this.audio.updateParams({ decay: SecurityUtils.validateNumber(e.target.value, 100, 2000) });
                    document.getElementById('decayValue').textContent = e.target.value + 'ms';
                    this.saveState();
                });

                document.getElementById('bpm').addEventListener('input', (e) => {
                    this.state.bpm = SecurityUtils.validateNumber(e.target.value, 40, 240);
                    document.getElementById('bpmValue').textContent = e.target.value;
                    document.getElementById('bpmDisplay').textContent = this.state.autoBeat ? e.target.value : '--';
                    this.saveState();
                });

                document.getElementById('autoBeatBtn').addEventListener('click', () => this.toggleAutoBeat());
                document.getElementById('autoChaoSwitch').addEventListener('click', () => this.toggleAutoChant());
                document.getElementById('clearPatternBtn').addEventListener('click', () => this.clearBeatPattern());

                document.querySelectorAll('.beat-dot').forEach(dot => {
                    dot.addEventListener('click', () => {
                        const idx = parseInt(dot.dataset.index, 10);
                        this.state.beatPattern[idx] = this.state.beatPattern[idx] ? 0 : 1;
                        dot.classList.toggle('active');
                        this.saveState();
                    });
                });

                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.applyPreset(btn.dataset.preset);
                        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    });
                });

                window.addEventListener('resize', () => {
                    this.particles.resize();
                    this.neurons.resize();
                });
            }

            async handleHit(e) {
                await this.audio.init();

                const rect = document.getElementById('muyuWrapper').getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;

                const now = Date.now();
                const timeSinceLast = now - this.state.lastHitTime;
                this.state.lastHitTime = now;

                this.state.combo = timeSinceLast < 1000 ? this.state.combo + 1 : 1;
                const velocity = Math.min(1 + this.state.combo * 0.1, 2);

                this.audio.playMuyu(velocity);
                this.triggerVisualHit(x, y, velocity);

                this.state.hitCount++;
                this.state.totalClicks++;
                document.getElementById('hitCount').textContent = this.state.hitCount.toLocaleString();
                document.getElementById('combo').textContent = this.state.combo;
                this.triggerCounterGlow();

                if (this.state.hitCount % 10 === 0) this.saveState();
            }

            triggerCounterGlow() {
                const counter = document.querySelector('.hit-counter');
                const hitCount = document.getElementById('hitCount');

                // 计数器霓虹闪光（重启动画）
                counter.classList.remove('counter-flash');
                void counter.offsetWidth;
                counter.classList.add('counter-flash');

                // 浮动 "+1 功德" 发光字
                const floatText = document.createElement('div');
                floatText.className = 'merit-float';
                floatText.textContent = '+1 功德';
                counter.appendChild(floatText);
                setTimeout(() => floatText.remove(), 900);
            }

            triggerVisualHit(x, y, velocity) {
                const muyuBody = document.getElementById('muyuBody');
                muyuBody.classList.add('hit');
                setTimeout(() => muyuBody.classList.remove('hit'), 150);

                this.particles.emit(x, y, Math.floor(20 + this.state.combo * 5));
                this.particles.emitRing(x, y);
                this.neurons.pulse(velocity);

                const container = document.getElementById('ringContainer');
                const ring = document.createElement('div');
                ring.className = 'muyu-ring';
                container.appendChild(ring);
                setTimeout(() => ring.remove(), 800);
            }

            handleKeyboard(e) {
                if (e.code === 'Space') {
                    e.preventDefault();
                    this.handleHit(e);
                } else if (e.key === 'm' || e.key === 'M') {
                    const muted = this.audio.toggleMute();
                    document.querySelector('.keyboard-hint').innerHTML = muted 
                        ? '🔇 已静音 - 按 <span class="key">M</span> 取消'
                        : '按 <span class="key">SPACE</span> 或 <span class="key">CLICK</span> 敲击 · <span class="key">1-4</span> 切换预设 · <span class="key">M</span> 静音';
                } else if (e.key >= '1' && e.key <= '4') {
                    const presets = ['zen', 'cyber', 'rain', 'temple'];
                    const idx = parseInt(e.key, 10) - 1;
                    this.applyPreset(presets[idx]);
                    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                    document.querySelector(`[data-preset="${presets[idx]}"]`).classList.add('active');
                }
            }

            toggleAutoBeat() {
                this.state.autoBeat = !this.state.autoBeat;
                const btn = document.getElementById('autoBeatBtn');
                btn.classList.toggle('active');
                btn.textContent = this.state.autoBeat ? '⏸ 停止节拍' : '▶ 自动节拍';
                document.getElementById('bpmDisplay').textContent = this.state.autoBeat ? this.state.bpm : '--';
            }

            clearBeatPattern() {
                this.state.beatPattern = [0, 0, 0, 0, 0, 0, 0, 0];
                document.querySelectorAll('.beat-dot').forEach(d => d.classList.remove('active'));
            }

            applyPreset(preset) {
                const presets = {
                    zen: { frequency: 440, tone: 50, reverb: 30, decay: 500 },
                    cyber: { frequency: 220, tone: 80, reverb: 50, decay: 800 },
                    rain: { frequency: 880, tone: 20, reverb: 70, decay: 200 },
                    temple: { frequency: 180, tone: 60, reverb: 80, decay: 1500 }
                };

                const params = presets[preset] || presets.zen;
                this.audio.updateParams(params);

                document.getElementById('frequency').value = params.frequency;
                document.getElementById('tone').value = params.tone;
                document.getElementById('reverb').value = params.reverb;
                document.getElementById('decay').value = params.decay;

                document.getElementById('freqValue').textContent = params.frequency + 'Hz';
                document.getElementById('toneValue').textContent = params.tone + '%';
                document.getElementById('reverbValue').textContent = params.reverb + '%';
                document.getElementById('decayValue').textContent = params.decay + 'ms';

                this.saveState();
            }

            saveState() {
                try {
                    localStorage.setItem('cyberMuyu2077', JSON.stringify({
                        hitCount: this.state.hitCount,
                        beatPattern: this.state.beatPattern,
                        bpm: this.state.bpm,
                        params: this.audio.params
                    }));
                } catch (e) { /* Storage unavailable */ }
            }

            loadState() {
                try {
                    const saved = localStorage.getItem('cyberMuyu2077');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.state.hitCount = data.hitCount || 0;
                        this.state.beatPattern = data.beatPattern || [1, 0, 1, 0, 1, 0, 1, 0];
                        this.state.bpm = data.bpm || 120;

                        if (data.params) {
                            this.audio.params = { ...this.audio.params, ...data.params };
                            document.getElementById('frequency').value = this.audio.params.frequency;
                            document.getElementById('tone').value = this.audio.params.tone;
                            document.getElementById('reverb').value = this.audio.params.reverb;
                            document.getElementById('decay').value = this.audio.params.decay;
                        }

                        document.getElementById('hitCount').textContent = this.state.hitCount.toLocaleString();
                        document.getElementById('bpm').value = this.state.bpm;
                        document.getElementById('bpmValue').textContent = this.state.bpm;
                        document.getElementById('freqValue').textContent = this.audio.params.frequency + 'Hz';
                        document.getElementById('toneValue').textContent = this.audio.params.tone + '%';
                        document.getElementById('reverbValue').textContent = this.audio.params.reverb + '%';
                        document.getElementById('decayValue').textContent = this.audio.params.decay + 'ms';

                        document.querySelectorAll('.beat-dot').forEach((dot, i) => {
                            dot.classList.toggle('active', !!this.state.beatPattern[i]);
                        });
                    }
                } catch (e) { /* No saved state */ }
            }

            animate() {
                this.neurons.update();
                this.particles.update();
                this.visualizer.update(this.audio.getAnalyserData());

                if (this.state.autoBeat) {
                    this.state.autoBeatTimer++;
                    const beatsPerFrame = this.state.bpm / 60 / 60;
                    if (this.state.autoBeatTimer % Math.max(1, Math.floor(60 / beatsPerFrame)) === 0) {
                        if (this.state.beatPattern[this.state.currentBeat]) {
                            this.handleHit(null);
                        }
                        this.state.currentBeat = (this.state.currentBeat + 1) % 8;
                        document.querySelectorAll('.beat-dot').forEach((dot, i) => {
                            dot.classList.toggle('current', i === this.state.currentBeat);
                        });
                    }
                }

                const elapsed = Math.floor((Date.now() - this.state.sessionStart) / 1000);
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                document.getElementById('sessionTime').textContent = 
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                document.getElementById('ppm').textContent = elapsed > 0 ? Math.floor((this.state.totalClicks / elapsed) * 60) : 0;
                document.getElementById('particleCount').textContent = this.particles.getCount();

                requestAnimationFrame(() => this.animate());
            }

            cleanup() {
                this.autoChant.cleanup();
                this.goldMerit.cleanup();
            }
        }

        // ========== INITIALIZATION ==========
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 1200);
            window.app = new CyberMuyu2077();
        });
    </script>
