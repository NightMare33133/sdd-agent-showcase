<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#04050a">
<meta name="description" content="赛博焚香 · 纯代码流体烟雾冥想炉：一支缓缓燃烧的赛博线香，香灰断落，烟雾袅袅。零依赖，单文件。">
<title>赛博焚香 · 流体烟雾冥想炉</title>
<style>
/* ============ 1. 设计令牌 Design Tokens ============ */
:root{
  --bg-0:#04050a; --bg-1:#0a0d16; --bg-2:#10141f;
  --ink:#e9e7de; --ink-dim:#9aa0b2; --ink-faint:#5c6172;
  --neon:#5eead4; --neon-2:#a78bfa;
  --ember:#ff7a45; --ember-hot:#ffb347; --gold:#e6c26a;
  --panel:rgba(13,16,26,.66); --line:rgba(94,234,212,.22);
  --speck:rgba(255,255,255,.28);
  --halo-a:rgba(94,234,212,.10); --halo-b:rgba(167,139,250,.07);
  --overlay-bg:rgba(2,3,6,.52);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --font-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-zen:"Kaiti SC","STKaiti","KaiTi","Songti SC","Noto Serif CJK SC",serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
[data-theme="light"]{
  --bg-0:#ece3cf; --bg-1:#f6f0e0; --bg-2:#fbf6ea;
  --ink:#2e2b24; --ink-dim:#6f6a5c; --ink-faint:#a49d8a;
  --neon:#0f766e; --neon-2:#7c3aed;
  --ember:#e2571f; --ember-hot:#ff9c3f; --gold:#a97d1f;
  --panel:rgba(252,248,238,.8); --line:rgba(15,118,110,.3);
  --speck:rgba(90,70,40,.22);
  --halo-a:rgba(186,140,60,.14); --halo-b:rgba(140,100,220,.06);
  --overlay-bg:rgba(236,226,204,.6);
  --shadow-lg:0 18px 44px rgba(96,78,44,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{overscroll-behavior:none}
body{
  font-family:var(--font-ui); color:var(--ink);
  background:
    radial-gradient(1200px 700px at 50% 118%, var(--bg-2), transparent 60%),
    linear-gradient(180deg, var(--bg-1), var(--bg-0) 78%);
  overflow:hidden; touch-action:none;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
  transition:background .6s ease, color .6s ease;
}
/* 星尘 */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55;
  background-image:
    radial-gradient(1px 1px at 12% 22%, var(--speck), transparent 55%),
    radial-gradient(1px 1px at 78% 14%, var(--speck), transparent 55%),
    radial-gradient(1.5px 1.5px at 64% 34%, var(--speck), transparent 55%),
    radial-gradient(1px 1px at 30% 58%, var(--speck), transparent 55%),
    radial-gradient(1px 1px at 88% 62%, var(--speck), transparent 55%),
    radial-gradient(1.5px 1.5px at 44% 8%, var(--speck), transparent 55%);
}
/* 暗角 */
body::after{
  content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(0,0,0,.42) 100%);
  transition:background .6s ease;
}
[data-theme="light"] body::after{
  background:radial-gradient(120% 90% at 50% 42%, transparent 60%, rgba(120,95,50,.15) 100%);
}
#stage{position:fixed; inset:0; z-index:5; pointer-events:none}
/* ============ 2. 标题 ============ */
.brand{position:fixed; top:calc(18px + env(safe-area-inset-top)); left:0; right:0; z-index:10; text-align:center; pointer-events:none}
.brand h1{font-family:var(--font-zen); font-weight:600; font-size:clamp(22px,3.4vw,30px); letter-spacing:.42em; text-indent:.42em; text-shadow:0 2px 18px rgba(0,0,0,.35)}
.brand .ornament{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:8px; color:var(--gold); font-size:11px}
.brand .ornament::before,.brand .ornament::after{content:""; width:52px; height:1px}
.brand .ornament::before{background:linear-gradient(90deg,transparent,var(--line))}
.brand .ornament::after{background:linear-gradient(90deg,var(--line),transparent)}
.brand .sub{margin-top:6px; font-family:var(--font-mono); font-size:10px; letter-spacing:.34em; color:var(--ink-faint)}
/* ============ 3. 玻璃卡片 ============ */
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:var(--shadow-lg)}
.hud{position:fixed; left:18px; top:calc(78px + env(safe-area-inset-top)); z-index:10; padding:13px 18px; min-width:170px}
.hud .row{display:flex; justify-content:space-between; align-items:baseline; gap:18px; padding:3px 0}
.hud .k{font-size:11px; letter-spacing:.22em; color:var(--ink-dim)}
.hud .v{font-family:var(--font-mono); font-size:16px; font-variant-numeric:tabular-nums}
.hud .v.acc{font-size:11px; color:var(--ink-faint)}
/* ============ 4. 工具按钮 ============ */
.tools{position:fixed; right:18px; top:calc(78px + env(safe-area-inset-top)); z-index:10; display:flex; flex-direction:column; gap:10px}
.icon-btn{width:42px; height:42px; border-radius:12px; border:1px solid var(--line); background:var(--panel); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--ink-dim); display:grid; place-items:center; cursor:pointer; box-shadow:var(--shadow-lg); transition:transform .18s ease, color .18s ease, border-color .18s ease}
.icon-btn:hover{transform:translateY(-2px); color:var(--neon); border-color:var(--neon)}
.icon-btn.on{color:var(--neon); border-color:var(--neon); box-shadow:0 0 16px rgba(94,234,212,.22), var(--shadow-lg)}
.icon-btn svg{width:20px; height:20px; display:block}
.icon-btn .off-mark{display:none}
.icon-btn:not(.on) .snd-on{display:none}
.icon-btn:not(.on) .off-mark{display:block}
/* ============ 5. 禅语 ============ */
.quote{position:fixed; left:50%; top:20vh; transform:translateX(-50%) translateY(8px); z-index:10; font-family:var(--font-zen); font-size:clamp(16px,2.6vw,22px); letter-spacing:.14em; color:var(--ink); opacity:0; transition:opacity 1.1s ease, transform 1.1s ease; pointer-events:none; text-align:center; max-width:min(82vw,560px); text-shadow:0 2px 14px rgba(0,0,0,.4)}
.quote.show{opacity:.92; transform:translateX(-50%) translateY(0)}
.quote .mark{color:var(--gold); margin-right:.5em; font-size:.8em}
/* ============ 6. 场景：线香 + 香炉 ============ */
.stage-dom{position:fixed; left:50%; bottom:calc(4vh + env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(430px,86vw); height:210px; z-index:3}
.stage-dom::before{content:""; position:absolute; left:50%; bottom:-90px; width:560px; height:560px; transform:translateX(-50%); pointer-events:none;
  background:radial-gradient(closest-side, var(--halo-a), transparent 70%), radial-gradient(closest-side, var(--halo-b), transparent 78%);}
.incense{position:absolute; bottom:88px; left:50%; transform:translateX(-50%); width:6px; height:200px; cursor:pointer}
.stick{position:absolute; bottom:0; left:0; width:100%; height:100%; border-radius:3px 3px 1px 1px;
  background:
    repeating-linear-gradient(0deg, transparent 0 16px, rgba(94,234,212,.10) 16px 17px),
    linear-gradient(90deg, #191b21, #30333d 46%, #15171d);
  box-shadow:0 0 0 .5px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.35);
  transition:filter .8s ease;
}
.ember{position:absolute; top:-5px; left:50%; width:10px; height:10px; transform:translateX(-50%); border-radius:50%;
  background:radial-gradient(circle at 35% 32%, #fff6dd, var(--ember-hot) 42%, var(--ember) 72%, rgba(255,110,50,0) 100%);
  animation:emberPulse 1.7s ease-in-out infinite;
  transition:opacity 1.4s ease, transform .3s ease;
}
.incense.unlit .ember{opacity:0; animation:none}
.incense.unlit .stick{filter:saturate(.4) brightness(.82)}
.ash-cap{position:absolute; bottom:100%; left:50%; transform:translateX(-50%); width:9px; height:0; border-radius:4px 4px 2px 2px;
  background:linear-gradient(180deg,#d8d2c4,#a49e8f 55%,#7e7869);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 1px 3px rgba(0,0,0,.3);
  transition:height .3s linear;
}
[data-theme="light"] .ash-cap{background:linear-gradient(180deg,#e8e2d2,#b3ac9a 55%,#8b8574)}
@keyframes emberPulse{
  0%,100%{box-shadow:0 0 10px 3px rgba(255,122,69,.55), 0 0 30px 12px rgba(255,110,50,.16)}
  50%{box-shadow:0 0 16px 5px rgba(255,150,90,.75), 0 0 46px 18px rgba(255,120,60,.26)}
}
.burner{position:absolute; bottom:0; left:0; right:0; height:104px; cursor:pointer}
.bowl{position:absolute; inset:0 0 14px 0; border-radius:30px 30px 22px 22px;
  background:
    linear-gradient(180deg, rgba(94,234,212,.06), transparent 30%),
    linear-gradient(180deg, #262b38, #14171f 55%, #0b0d13);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:inset 0 14px 26px rgba(0,0,0,.55), inset 0 -8px 18px rgba(94,234,212,.05), 0 20px 44px rgba(0,0,0,.5);
}
[data-theme="light"] .bowl{background:linear-gradient(180deg,#efe6d2,#ded2b8 55%,#c9bb9c); border-color:rgba(120,100,60,.25); box-shadow:inset 0 12px 22px rgba(120,95,50,.18), 0 18px 36px rgba(96,78,44,.22)}
.rim{position:absolute; top:-11px; left:50%; transform:translateX(-50%); width:72%; height:22px; border-radius:50%;
  background:linear-gradient(180deg,#1b1f2a,#0c0e14); border:1px solid var(--line);
  box-shadow:0 0 18px rgba(94,234,212,.18), inset 0 4px 10px rgba(0,0,0,.8);
}
[data-theme="light"] .rim{background:linear-gradient(180deg,#d9cca9,#bfb08c); border-color:rgba(15,118,110,.4); box-shadow:0 0 14px rgba(15,118,110,.15), inset 0 4px 10px rgba(90,70,40,.4)}
.rim::after{content:""; position:absolute; inset:5px 10px; border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.75), rgba(0,0,0,.2))}
.leds{position:absolute; top:30%; left:16px; display:flex; gap:6px}
.leds i{width:5px; height:5px; border-radius:50%; background:var(--neon); opacity:.25; box-shadow:0 0 6px rgba(94,234,212,.6)}
.leds i:nth-child(1){animation:ledBlink 2.4s infinite}
.leds i:nth-child(2){animation:ledBlink 2.4s infinite .4s}
.leds i:nth-child(3){animation:ledBlink 2.4s infinite .9s}
@keyframes ledBlink{0%,100%{opacity:.2}12%{opacity:1}}
.bowl .scan{position:absolute; left:16%; right:16%; top:58%; height:1px; background:linear-gradient(90deg,transparent,rgba(94,234,212,.4),transparent)}
.bowl .scan i{position:absolute; left:50%; top:-2px; width:30px; height:5px; margin-left:-15px; border-radius:50%; background:radial-gradient(closest-side,rgba(94,234,212,.5),transparent); animation:scanMove 7s ease-in-out infinite}
@keyframes scanMove{0%{transform:translateX(-80%);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateX(80%);opacity:0}}
[data-theme="light"] .bowl .scan{background:linear-gradient(90deg,transparent,rgba(15,118,110,.45),transparent)}
[data-theme="light"] .bowl .scan i{background:radial-gradient(closest-side,rgba(15,118,110,.55),transparent)}
[data-theme="light"] .leds i{box-shadow:0 0 6px rgba(15,118,110,.5)}
.bowl .tag{position:absolute; bottom:9px; left:0; right:0; text-align:center; font-family:var(--font-mono); font-size:9px; letter-spacing:.3em; color:var(--ink-faint); opacity:.75}
.foot{position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:42%; height:18px; background:linear-gradient(180deg,#171a22,#0a0c11); clip-path:polygon(12% 0,88% 0,100% 100%,0 100%); border-radius:0 0 6px 6px; box-shadow:0 8px 18px rgba(0,0,0,.5)}
[data-theme="light"] .foot{background:linear-gradient(180deg,#d6c9a6,#b3a582)}
.ash-pile{position:absolute; top:-14px; left:50%; transform:translateX(-50%); width:0; height:16px; border-radius:50%; background:radial-gradient(closest-side,#cfc9bb,#96907f 70%,transparent); filter:blur(.4px); transition:width .8s ease; z-index:2}
[data-theme="light"] .ash-pile{background:radial-gradient(closest-side,#ded7c4,#a49c86 70%,transparent)}
/* ============ 7. 功德浮字 ============ */
.merit-layer{position:fixed; inset:0; z-index:20; pointer-events:none}
.merit{position:absolute; transform:translate(-50%,-50%); font-family:var(--font-zen); font-size:18px; letter-spacing:.2em; color:var(--gold); text-shadow:0 2px 12px rgba(0,0,0,.5); animation:floatUp 1.5s ease-out forwards; white-space:nowrap}
@keyframes floatUp{
  0%{opacity:0; transform:translate(calc(-50% + var(--dx,0px)), -50%) scale(.7)}
  12%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx,0px)), calc(-50% - 74px)) scale(1.05)}
}
/* ============ 8. 呼吸引导 ============ */
.breath{position:fixed; left:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:10; display:flex; align-items:center; gap:12px; padding:10px 14px}
.breath[hidden]{display:none}
.breath .ring{width:46px; height:46px; border-radius:50%; border:2px solid var(--neon); box-shadow:0 0 14px rgba(94,234,212,.35), inset 0 0 10px rgba(94,234,212,.25); will-change:transform}
.breath .txt{display:flex; flex-direction:column; gap:2px}
.breath .lbl{font-size:12px; letter-spacing:.3em}
.breath .cnt{font-family:var(--font-mono); font-size:10px; color:var(--ink-faint)}
/* ============ 9. 提示 / Dock ============ */
.hint{position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:9; font-size:11px; letter-spacing:.12em; color:var(--ink-faint); text-align:right; line-height:1.9}
.hint b{color:var(--ink-dim); font-weight:600}
.dock{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:10; display:flex; align-items:center; gap:14px; padding:10px 14px; border-radius:18px}
.modes{display:flex; gap:8px}
.pill{border:1px solid var(--line); background:transparent; color:var(--ink-dim); font-family:var(--font-ui); font-size:12px; letter-spacing:.08em; padding:7px 12px; border-radius:999px; cursor:pointer; transition:all .18s ease}
.pill:hover{color:var(--ink)}
.pill.active{color:var(--neon); border-color:var(--neon); background:rgba(94,234,212,.08)}
[data-theme="light"] .pill.active{background:rgba(15,118,110,.08)}
.pill:disabled{opacity:.38; cursor:default}
#btnIgnite{border:none; cursor:pointer; font-family:var(--font-ui); font-weight:600; font-size:14px; letter-spacing:.3em; text-indent:.3em; color:#20100a; padding:11px 26px; border-radius:999px; background:linear-gradient(135deg, var(--ember), var(--ember-hot)); box-shadow:0 6px 24px rgba(255,122,69,.35), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .18s ease, box-shadow .18s ease, filter .18s ease}
#btnIgnite:hover{transform:translateY(-2px); filter:brightness(1.06)}
#btnIgnite.stop{background:linear-gradient(135deg,#3a4152,#59637a); color:#e9e7de; box-shadow:0 6px 20px rgba(0,0,0,.35)}
.idle #btnIgnite{animation:breathBtn 2.8s ease-in-out infinite}
@keyframes breathBtn{0%,100%{box-shadow:0 6px 24px rgba(255,122,69,.30), inset 0 1px 0 rgba(255,255,255,.35)}50%{box-shadow:0 6px 34px rgba(255,140,80,.55), inset 0 1px 0 rgba(255,255,255,.35)}}
/* ============ 10. 结算浮层 ============ */
.overlay{position:fixed; inset:0; z-index:30; display:grid; place-items:center; background:var(--overlay-bg); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); opacity:0; visibility:hidden; transition:opacity .45s ease, visibility .45s}
.overlay.open{opacity:1; visibility:visible}
.panel{padding:34px 40px; text-align:center; min-width:min(86vw,340px); transform:translateY(12px); transition:transform .45s ease}
.overlay.open .panel{transform:none}
.panel .emoji{font-size:30px; margin-bottom:6px}
.panel h2{font-family:var(--font-zen); font-size:30px; letter-spacing:.3em; text-indent:.3em; margin-bottom:8px}
.panel .stats{font-size:13px; color:var(--ink-dim); letter-spacing:.1em; margin-bottom:22px}
.panel .actions{display:flex; gap:12px; justify-content:center}
.btn{border:none; cursor:pointer; font-family:var(--font-ui); font-size:13px; letter-spacing:.14em; padding:10px 22px; border-radius:999px; transition:transform .18s ease, box-shadow .18s ease, color .18s ease, border-color .18s ease}
.btn-primary{background:linear-gradient(135deg, var(--ember), var(--ember-hot)); color:#20100a; font-weight:600; box-shadow:0 6px 20px rgba(255,122,69,.35)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink-dim)}
.btn-ghost:hover{color:var(--neon); border-color:var(--neon)}
:focus-visible{outline:2px solid var(--neon); outline-offset:2px; border-radius:8px}
noscript{position:fixed; inset:0; z-index:99; display:grid; place-items:center; background:var(--bg-0); color:var(--ink); font-size:16px}
/* ============ 11. 响应式 ============ */
@media (max-width:680px){
  .hud{left:12px; top:calc(66px + env(safe-area-inset-top)); padding:10px 12px; min-width:140px}
  .hud .v{font-size:14px}
  .tools{right:12px; top:calc(66px + env(safe-area-inset-top)); gap:8px}
  .icon-btn{width:38px; height:38px}
  .quote{top:16vh; font-size:16px; width:88vw}
  .stage-dom{width:88vw; bottom:calc(3vh + env(safe-area-inset-bottom))}
  .dock{gap:8px; padding:8px 10px; max-width:94vw; flex-wrap:wrap; justify-content:center}
  .hint{display:none}
  .brand h1{letter-spacing:.3em; text-indent:.3em}
}
@media (max-height:600px){
  .stage-dom{bottom:calc(10vh + env(safe-area-inset-bottom))}
  .quote{top:13vh}
}
@media (prefers-reduced-motion:reduce){
  .ember{animation:none; box-shadow:0 0 12px 4px rgba(255,122,69,.55)}
  .leds i,.bowl .scan i{animation:none}
  .idle #btnIgnite{animation:none}
}
</style>
</head>
<body class="idle">
  <canvas id="stage" aria-hidden="true"></canvas>

  <header class="brand">
    <h1>赛博焚香</h1>
    <div class="ornament">✦</div>
    <p class="sub">CYBER INCENSE · FLUID SMOKE MEDITATION STOVE</p>
  </header>

  <section class="hud card" aria-label="修行数据">
    <div class="row"><span class="k">静坐</span><span class="v" id="hudTime">00:00</span></div>
    <div class="row"><span class="k">香灰</span><span class="v" id="hudAsh">0</span></div>
    <div class="row"><span class="k">功德</span><span class="v" id="hudMerit">0</span></div>
    <div class="row"><span class="k">累计</span><span class="v acc" id="hudTotal">0 炷 · 0 分</span></div>
  </section>

  <div class="tools">
    <button class="icon-btn on" id="btnSound" aria-label="环境音开关" aria-pressed="true" title="环境音">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5v5h3.2L12 19V5L7.2 9.5H4z"/>
        <g class="snd-on"><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18 7a7.2 7.2 0 0 1 0 10"/></g>
        <g class="off-mark"><path d="M16 9.8l5 4.4M21 9.8l-5 4.4"/></g>
      </svg>
    </button>
    <button class="icon-btn" id="btnBreath" aria-label="呼吸引导开关" aria-pressed="false" title="呼吸引导">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7" opacity=".55"/><circle cx="12" cy="12" r="10.4" opacity=".25"/>
      </svg>
    </button>
    <button class="icon-btn" id="btnTheme" aria-label="明暗主题切换" aria-pressed="false" title="明暗主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="8.6"/><path d="M12 3.4v17.2"/>
        <path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" fill="currentColor" stroke="none" opacity=".8"/>
      </svg>
    </button>
  </div>

  <div class="quote" id="quote" aria-live="polite"><span class="mark">✦</span><span id="quoteText"></span></div>

  <div class="stage-dom" id="stageDom">
    <div class="incense unlit" id="incense">
      <div class="ash-cap" id="ashCap"></div>
      <div class="stick" id="stick"><div class="ember" id="ember"></div></div>
    </div>
    <div class="burner" id="burner">
      <div class="bowl">
        <div class="rim"></div>
        <div class="leds" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="scan" aria-hidden="true"><i></i></div>
        <div class="tag">NIRVANA-9000 · MEDITATION UNIT</div>
      </div>
      <div class="ash-pile" id="ashPile"></div>
      <div class="foot"></div>
    </div>
  </div>

  <div class="merit-layer" id="meritLayer" aria-hidden="true"></div>

  <div class="breath card" id="breath" hidden>
    <div class="ring" id="breathRing"></div>
    <div class="txt"><span class="lbl" id="breathLbl">吸气</span><span class="cnt">吸 4 · 呼 6</span></div>
  </div>

  <p class="hint"><b>点按香炉</b> · 功德 +1<br><b>划动屏幕</b> · 拨动烟雾<br><b>空格键</b> · 功德 +1</p>

  <nav class="dock card" aria-label="焚香控制">
    <div class="modes" id="modes">
      <button class="pill" data-i="0">小憩 1′</button>
      <button class="pill" data-i="1">一炷香 5′</button>
      <button class="pill" data-i="2">长坐 15′</button>
    </div>
    <button id="btnIgnite">点　火</button>
  </nav>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
    <div class="panel card">
      <div class="emoji">🪔</div>
      <h2 id="ovTitle">一炷香毕</h2>
      <p class="stats" id="ovStats"></p>
      <div class="actions">
        <button class="btn btn-primary" id="btnAgain">再点一炷</button>
        <button class="btn btn-ghost" id="btnClose">静候片刻</button>
      </div>
    </div>
  </div>

  <noscript><p>需要启用 JavaScript 才能点燃这炉香。</p></noscript>

<script>
'use strict';
(function(){
  /* ---------- 0. 工具函数 ---------- */
  var $ = function(s){ return document.querySelector(s); };
  var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
  var rand = function(a,b){ return a+Math.random()*(b-a); };
  var pick = function(arr){ return arr[(Math.random()*arr.length)|0]; };
  var smooth = function(a,b,x){ x=clamp((x-a)/(b-a),0,1); return x*x*(3-2*x); };
  var fmt = function(s){ s=Math.max(0,Math.floor(s)); var m=Math.floor(s/60), r=s%60;
    return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; };
  var RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- 1. 文案（全部硬编码，无用户输入面） ---------- */
  var QUOTES = ['香灰落下，bug 蒸发。','心静，则代码自安。','一炷香，足够想通一个需求。',
    '云在青天，水在瓶。','风来疏竹，风过而竹不留声。','此刻没有推送，只有呼吸。',
    '慢即是快，静即是进。','灰烬坠地，焦虑清零。','服务器很稳，你也很稳。',
    '呼吸之间，灵感自来。','万物皆流，唯有此刻真实。','屏幕之外，山水辽阔。',
    '尘归尘，灰归灰，需求归产品。','静坐一分，功德一分。','烟无形，心无住。',
    '不急，香还长。','火候到了，事情就成了。','今夜月色很好，像刚部署成功的凌晨三点。'];
  var IGNITE_QUOTES = ['火起，心安。','香已点燃，请入定。','一炷心香，敬此刻。'];
  var bag = [];
  function nextQuote(){
    if(!bag.length){ bag = QUOTES.slice();
      for(var i=bag.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=bag[i]; bag[i]=bag[j]; bag[j]=t; } }
    return bag.pop();
  }

  /* ---------- 2. 持久化（隐私模式容错） ---------- */
  var KEY = 'cyberIncense.v1';
  var prefs = { theme:'dark', sound:true, breath:false, modeIdx:1 };
  var totals = { sec:0, ash:0, merit:0, sessions:0 };
  (function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(raw && typeof raw === 'object'){
        if(raw.prefs) Object.assign(prefs, raw.prefs);
        if(raw.totals) Object.assign(totals, raw.totals);
      }
    }catch(e){}
  })();
  var lastSave = 0;
  function save(force){
    var n = performance.now();
    if(!force && n-lastSave<4000) return;
    lastSave = n;
    try{ localStorage.setItem(KEY, JSON.stringify({prefs:prefs, totals:totals})); }catch(e){}
  }

  /* ---------- 3. DOM 引用 ---------- */
  var canvas=$('#stage'), ctx=canvas.getContext('2d');
  var incense=$('#incense'), stick=$('#stick'), emberEl=$('#ember'), ashCap=$('#ashCap');
  var stageDom=$('#stageDom'), ashPile=$('#ashPile');
  var hudTime=$('#hudTime'), hudAsh=$('#hudAsh'), hudMerit=$('#hudMerit'), hudTotal=$('#hudTotal');
  var quoteEl=$('#quote'), quoteText=$('#quoteText');
  var overlay=$('#overlay'), ovTitle=$('#ovTitle'), ovStats=$('#ovStats');
  var btnIgnite=$('#btnIgnite'), modesBox=$('#modes');
  var pills=Array.prototype.slice.call(document.querySelectorAll('.pill'));
  var btnSound=$('#btnSound'), btnBreath=$('#btnBreath'), btnTheme=$('#btnTheme');
  var breathPanel=$('#breath'), breathRing=$('#breathRing'), breathLbl=$('#breathLbl');
  var meritLayer=$('#meritLayer');

  /* ---------- 4. 状态 ---------- */
  var MODES=[{sec:60},{sec:300},{sec:900}];
  var modeIdx = clamp(prefs.modeIdx|0, 0, 2);
  var sessionLen = MODES[modeIdx].sec;
  var state='idle';
  var burnElapsed=0, progress=0, merit=0, ashCount=0;
  var capH=0, capMax=16, cycleDur=12, pileW=0;
  var baseH=240, stickH=240, sparkT=3, shownSec=-1, breathT=0;
  var INC_OFFSET=88;
  var stageRect={left:0,top:0,right:0,bottom:0,width:0};

  /* ---------- 5. Canvas 与 Sprite ---------- */
  var W=0, H=0;
  var SPRITE_S=128;
  function makeSprite(rgb){
    var c=document.createElement('canvas'); c.width=c.height=SPRITE_S;
    var g=c.getContext('2d');
    var grd=g.createRadialGradient(64,64,2,64,64,64);
    grd.addColorStop(0,'rgba('+rgb+',0.55)');
    grd.addColorStop(0.4,'rgba('+rgb+',0.22)');
    grd.addColorStop(1,'rgba('+rgb+',0)');
    g.fillStyle=grd; g.fillRect(0,0,SPRITE_S,SPRITE_S);
    return c;
  }
  var THEME={
    dark:{ smoke:'226,229,238', ash:'#b8b2a4', peak:0.34 },
    light:{ smoke:'70,76,96', ash:'#847e6e', peak:0.42 }
  };
  var smokeSprite=makeSprite(THEME.dark.smoke);
  var sparkSprite=makeSprite('255,190,120');
  var ashCol=THEME.dark.ash, peakA=THEME.dark.peak;
  function applyTheme(){
    var t=THEME[prefs.theme]||THEME.dark;
    smokeSprite=makeSprite(t.smoke); ashCol=t.ash; peakA=t.peak;
  }

  /* ---------- 6. 粒子池 ---------- */
  var smoke=[], ashP=[], sparks=[];
  var smokeAcc=0;
  var wind={gustX:0, gustY:0};
  var ptr={x:-9999, y:-9999, vx:0, vy:0};

  function resize(){
    var dpr=clamp(window.devicePixelRatio||1,1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    baseH=clamp(Math.round(H*0.34),180,330);
    if(state==='burning'){ stickH=baseH*(1-0.92*progress); }
    else{ stickH=baseH; }
    incense.style.height=stickH.toFixed(1)+'px';
    stageRect=stageDom.getBoundingClientRect();
  }
  function tipPos(){
    return { x: stageRect.left + stageRect.width/2,
             y: stageRect.bottom - INC_OFFSET - stickH + 1 };
  }

  function spawnSmoke(n,burst){
    n=n||1;
    for(var i=0;i<n;i++){
      if(smoke.length>=180) break;
      var t=tipPos();
      smoke.push({ x:t.x+rand(-2,2), y:t.y+rand(-3,1),
        vx:rand(-7,7)+(burst?rand(-16,16):0), vy:rand(-54,-30),
        s0:rand(7,13), grow:rand(46,86), age:0, max:rand(3.4,5.8),
        seed:rand(0,6.283), a:rand(0.7,1) });
    }
  }
  function spawnAshChunks(){
    var t=tipPos();
    var n=3+((Math.random()*3)|0);
    for(var i=0;i<n;i++){
      ashP.push({ x:t.x+rand(-3,3), y:t.y+rand(0,4),
        vx:rand(-14,14), vy:rand(8,36), w:rand(3,7), h:rand(3,9),
        rot:rand(0,3.14), vr:rand(-3,3), age:0, max:rand(1.5,2.6) });
    }
    for(var k=0;k<5;k++){
      if(smoke.length>=190) break;
      smoke.push({ x:t.x+rand(-3,3), y:t.y+rand(-2,2),
        vx:rand(-18,18), vy:rand(-40,-12), s0:rand(6,10), grow:rand(50,90),
        age:0, max:rand(1.6,2.6), seed:rand(0,6.283), a:0.9 });
    }
  }
  function spawnSparks(n){
    var t=tipPos();
    for(var i=0;i<n;i++){
      sparks.push({ x:t.x+rand(-1,1), y:t.y,
        vx:rand(-34,34), vy:rand(-80,-24), age:0, max:rand(0.5,1.1) });
    }
  }

  /* ---------- 7. 禅语 / 功德 / HUD ---------- */
  var quoteTimer=null;
  function showQuote(text){
    quoteText.textContent=text;
    quoteEl.classList.add('show');
    if(quoteTimer) clearTimeout(quoteTimer);
    quoteTimer=setTimeout(function(){ quoteEl.classList.remove('show'); },4600);
  }
  function hudTotalRefresh(){
    hudTotal.textContent=totals.sessions+' 炷 · '+Math.round(totals.sec/60)+' 分';
  }
  function meritFloat(x,y){
    if(RM) return;
    var s=document.createElement('span');
    s.className='merit'; s.textContent='功德 +1';
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.setProperty('--dx',(rand(-20,20)|0)+'px');
    meritLayer.appendChild(s);
    s.addEventListener('animationend',function(){
      if(s.parentNode) s.parentNode.removeChild(s);
    });
  }
  function addMerit(x,y){
    merit++; totals.merit++;
    hudMerit.textContent=String(merit);
    hudTotalRefresh();
    meritFloat(x,y);
    Sfx.tickSnd();
    save(false);
  }

  /* ---------- 8. 香灰断裂 ---------- */
  function breakAsh(){
    spawnAshChunks();
    capH=0; ashCap.style.height='0px';
    cycleDur=rand(10,18);
    ashCount++; totals.ash++;
    hudAsh.textContent=String(ashCount);
    pileW=Math.min(96,12+ashCount*8);
    ashPile.style.width=pileW+'px';
    showQuote(nextQuote());
    Sfx.chime();
    save(false);
  }

  /* ---------- 9. 状态机 ---------- */
  function setState(s){
    state=s;
    document.body.classList.remove('idle','burning','done');
    document.body.classList.add(s);
  }
  function ignite(){
    if(state==='burning') return;
    setState('burning');
    burnElapsed=0; progress=0; merit=0; ashCount=0;
    capH=0; pileW=0; cycleDur=rand(10,16); shownSec=-1; breathT=0;
    stickH=baseH; incense.style.height=stickH.toFixed(1)+'px';
    ashPile.style.width='0px'; ashCap.style.height='0px';
    incense.classList.remove('unlit');
    hudTime.textContent='00:00'; hudAsh.textContent='0'; hudMerit.textContent='0';
    btnIgnite.textContent='熄　香'; btnIgnite.classList.add('stop');
    pills.forEach(function(p){ p.disabled=true; });
    overlay.classList.remove('open');
    Sfx.ensure(); Sfx.crackle();
    if(prefs.sound) Sfx.startAmbient();
    emberEl.style.transform='translateX(-50%) scale(1.7)';
    setTimeout(function(){ emberEl.style.transform='translateX(-50%) scale(1)'; },260);
    spawnSmoke(10,true);
    if(!RM) spawnSparks(3);
    showQuote(pick(IGNITE_QUOTES));
    save(true);
  }
  function finish(kind){
    if(state!=='burning') return;
    setState('done');
    totals.sec+=burnElapsed; totals.sessions++;
    hudTotalRefresh();
    incense.classList.add('unlit');
    if(capH>3){
      spawnAshChunks();
      capH=0; ashCap.style.height='0px';
      ashCount++; totals.ash++;
      hudAsh.textContent=String(ashCount);
    }
    if(prefs.sound) Sfx.stopAmbient();
    Sfx.gong();
    btnIgnite.textContent='点　火'; btnIgnite.classList.remove('stop');
    pills.forEach(function(p){ p.disabled=false; });
    ovTitle.textContent = kind==='natural' ? '一炷香毕' : '香已熄';
    ovStats.textContent = '本次静坐 '+fmt(burnElapsed)+' · 香灰断落 '+ashCount+' 次 · 功德 +'+merit;
    overlay.classList.add('open');
    showQuote(kind==='natural' ? '香成灰，心归静。' : '香灭了，心还在。');
    save(true);
  }
  function toIdle(){
    setState('idle');
    stickH=baseH; incense.style.height=stickH.toFixed(1)+'px';
    capH=0; ashCap.style.height='0px';
    pileW=0; ashPile.style.width='0px';
    burnElapsed=0; progress=0; shownSec=-1;
    hudTime.textContent='00:00'; hudAsh.textContent='0'; hudMerit.textContent='0';
    btnIgnite.textContent='点　火'; btnIgnite.classList.remove('stop');
    refreshPills();
  }

  /* ---------- 10. 音频引擎（Web Audio 纯合成） ---------- */
  var Sfx={
    ctx:null, master:null, amb:null,
    ensure:function(){
      try{
        if(!this.ctx){
          var AC=window.AudioContext||window.webkitAudioContext;
          if(!AC) return;
          this.ctx=new AC();
          this.master=this.ctx.createGain();
          this.master.gain.value=0.9;
          this.master.connect(this.ctx.destination);
        }
        if(this.ctx.state==='suspended') this.ctx.resume();
      }catch(e){}
    },
    ok:function(){ return !!(this.ctx && prefs.sound); },
    noiseSrc:function(){
      var c=this.ctx, len=Math.floor(c.sampleRate*2);
      var buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
      var s=c.createBufferSource(); s.buffer=buf; s.loop=true;
      return s;
    },
    startAmbient:function(){
      if(!this.ok()||this.amb) return;
      var c=this.ctx;
      var g=c.createGain();
      g.gain.setValueAtTime(0,c.currentTime);
      g.gain.linearRampToValueAtTime(1,c.currentTime+2.5);
      g.connect(this.master);
      var o1=c.createOscillator(); o1.type='sine'; o1.frequency.value=110;
      var g1=c.createGain(); g1.gain.value=0.022; o1.connect(g1); g1.connect(g);
      var o2=c.createOscillator(); o2.type='sine'; o2.frequency.value=165.2;
      var g2=c.createGain(); g2.gain.value=0.013; o2.connect(g2); g2.connect(g);
      var lfo=c.createOscillator(); lfo.frequency.value=0.07;
      var lg=c.createGain(); lg.gain.value=2.5; lfo.connect(lg); lg.connect(o2.frequency);
      var nz=this.noiseSrc();
      var f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=340; f.Q.value=0.6;
      var gn=c.createGain(); gn.gain.value=0.02;
      nz.connect(f); f.connect(gn); gn.connect(g);
      var flfo=c.createOscillator(); flfo.frequency.value=0.05;
      var fg=c.createGain(); fg.gain.value=150; flfo.connect(fg); fg.connect(f.frequency);
      o1.start(); o2.start(); lfo.start(); flfo.start(); nz.start();
      this.amb={g:g, nodes:[o1,o2,lfo,flfo,nz]};
    },
    stopAmbient:function(){
      if(!this.amb) return;
      var c=this.ctx, a=this.amb; this.amb=null;
      try{
        var t=c.currentTime;
        a.g.gain.cancelScheduledValues(t);
        a.g.gain.setValueAtTime(a.g.gain.value,t);
        a.g.gain.linearRampToValueAtTime(0,t+1.1);
        a.nodes.forEach(function(n){ try{ n.stop(t+1.2); }catch(e){} });
      }catch(e){}
    },
    blip:function(freq,dur,vol,type){
      if(!this.ok()) return;
      try{
        var c=this.ctx, t=c.currentTime;
        var o=c.createOscillator(); o.type=type||'sine'; o.frequency.value=freq;
        var g=c.createGain();
        g.gain.setValueAtTime(vol,t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t+dur+0.05);
      }catch(e){}
    },
    chime:function(){
      var base=pick([523.25,587.33,659.25,698.46,783.99]);
      this.blip(base,1.7,0.10);
      this.blip(base*2.01,0.9,0.035);
      this.blip(base*0.5,2.0,0.045);
    },
    gong:function(){
      this.blip(98,4.2,0.16); this.blip(147.2,3.4,0.11);
      this.blip(196.8,2.6,0.08); this.blip(49,4.6,0.10);
    },
    tickSnd:function(){
      if(!this.ok()) return;
      try{
        var c=this.ctx, t=c.currentTime;
        var o=c.createOscillator(); o.type='triangle';
        o.frequency.setValueAtTime(720,t);
        o.frequency.exponentialRampToValueAtTime(240,t+0.09);
        var g=c.createGain();
        g.gain.setValueAtTime(0.12,t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t+0.14);
      }catch(e){}
    },
    crackle:function(){
      if(!this.ok()) return;
      try{
        var c=this.ctx, t=c.currentTime;
        var nz=this.noiseSrc();
        var f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1600; f.Q.value=0.7;
        var g=c.createGain();
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.09,t+0.06);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
        nz.connect(f); f.connect(g); g.connect(this.master);
        nz.start(t); nz.stop(t+0.75);
      }catch(e){}
    }
  };

  /* ---------- 11. 呼吸引导 ---------- */
  function tickBreath(dt){
    if(!prefs.breath || state!=='burning') return;
    breathT+=dt;
    var ph=breathT%10, s, lbl;
    if(ph<4){ lbl='吸气'; s=1+0.5*smooth(0,4,ph); }
    else{ lbl='呼气'; s=1.5-0.5*smooth(4,10,ph); }
    if(breathLbl.textContent!==lbl) breathLbl.textContent=lbl;
    breathRing.style.transform='scale('+s.toFixed(3)+')';
  }

  /* ---------- 12. 主循环 ---------- */
  var windBase=0;
  function tick(dt,now){
    ptr.vx*=Math.exp(-dt*4); ptr.vy*=Math.exp(-dt*4);
    wind.gustX*=Math.exp(-dt*2.2); wind.gustY*=Math.exp(-dt*2.2);
    windBase=Math.sin(now*0.35)*7+Math.sin(now*0.13+1.7)*4;

    if(state==='burning'){
      burnElapsed+=dt;
      progress=clamp(burnElapsed/sessionLen,0,1);
      var sec=Math.floor(burnElapsed);
      if(sec!==shownSec){ shownSec=sec; hudTime.textContent=fmt(sec); }
      var target=baseH*(1-0.92*progress);
      stickH+=(target-stickH)*clamp(dt*6,0,1);
      incense.style.height=stickH.toFixed(1)+'px';
      if(progress>=1){ finish('natural'); }
      else{
        capH+=(capMax/cycleDur)*dt*(RM?0.7:1);
        if(capH>=capMax){ breakAsh(); }
        else{ ashCap.style.height=capH.toFixed(1)+'px'; }
        smokeAcc+=dt*(RM?7:15);
        while(smokeAcc>=1){ smokeAcc-=1; spawnSmoke(1,false); }
        if(!RM){
          sparkT-=dt;
          if(sparkT<=0){ spawnSparks(1+((Math.random()*2)|0)); sparkT=rand(2.2,5.5); }
        }
        tickBreath(dt);
      }
    }

    /* 烟雾：风场 + 湍流 + 浮力 + 指针扰动 */
    var i, p, k;
    for(i=smoke.length-1;i>=0;i--){
      p=smoke[i]; p.age+=dt;
      if(p.age>=p.max){ smoke.splice(i,1); continue; }
      k=p.age/p.max;
      var wTarget=windBase+Math.sin(now*0.6+p.seed)*8*(1-k*0.4)+wind.gustX*(1-k);
      p.vx+=(wTarget-p.vx)*clamp(dt*1.4,0,1);
      p.vy+=(-36-p.vy)*clamp(dt*0.7,0,1)+wind.gustY*(1-k)*dt*4;
      p.vx+=Math.sin(p.y*0.02+now*1.3+p.seed)*14*dt;
      var dx=p.x-ptr.x, dy=p.y-ptr.y, d2=dx*dx+dy*dy;
      if(d2<16900){
        var f=1-Math.sqrt(d2)/130;
        p.vx+=ptr.vx*f*dt*2.4;
        p.vy+=(ptr.vy*f*2.4-30*f)*dt;
      }
      p.x+=p.vx*dt; p.y+=p.vy*dt;
    }
    /* 香灰碎片：重力 + 空气阻力 + 微风 */
    for(i=ashP.length-1;i>=0;i--){
      p=ashP[i]; p.age+=dt;
      if(p.age>=p.max){ ashP.splice(i,1); continue; }
      p.vy+=300*dt;
      p.vx+=(windBase*0.8-p.vx)*clamp(dt*0.9,0,1);
      p.rot+=p.vr*dt;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
    }
    /* 火星 */
    for(i=sparks.length-1;i>=0;i--){
      p=sparks[i]; p.age+=dt;
      if(p.age>=p.max){ sparks.splice(i,1); continue; }
      p.vy+=150*dt; p.vx*=Math.exp(-dt*1.5);
      p.x+=p.vx*dt; p.y+=p.vy*dt;
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    var i, p, k, size, a;
    ctx.fillStyle=ashCol;
    for(i=0;i<ashP.length;i++){
      p=ashP[i]; k=p.age/p.max;
      ctx.globalAlpha=1-smooth(0.6,1,k);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    for(i=0;i<smoke.length;i++){
      p=smoke[i]; k=p.age/p.max;
      size=p.s0+p.grow*k;
      a=peakA*p.a*smooth(0,0.12,k)*(1-smooth(0.55,1,k));
      if(a<=0.004) continue;
      ctx.globalAlpha=a;
      ctx.drawImage(smokeSprite,p.x-size/2,p.y-size/2,size,size);
    }
    ctx.globalCompositeOperation='lighter';
    for(i=0;i<sparks.length;i++){
      p=sparks[i]; k=p.age/p.max;
      size=5+12*k;
      ctx.globalAlpha=(1-k)*0.9;
      ctx.drawImage(sparkSprite,p.x-size/2,p.y-size/2,size,size);
    }
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }
  var last=performance.now();
  function frame(now){
    var dt=(now-last)/1000; last=now;
    if(dt>0.05) dt=0.05;
    if(dt<0) dt=0;
    tick(dt,now/1000);
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- 13. 控件与交互 ---------- */
  function refreshPills(){
    pills.forEach(function(p,i){
      p.classList.toggle('active',i===modeIdx);
      p.disabled=(state==='burning');
    });
  }
  function refreshSound(){
    btnSound.classList.toggle('on',prefs.sound);
    btnSound.setAttribute('aria-pressed',String(prefs.sound));
  }
  function refreshBreath(){
    breathPanel.hidden=!prefs.breath;
    btnBreath.classList.toggle('on',prefs.breath);
    btnBreath.setAttribute('aria-pressed',String(prefs.breath));
  }
  function refreshTheme(){
    document.documentElement.dataset.theme=prefs.theme;
    applyTheme();
    btnTheme.setAttribute('aria-pressed',String(prefs.theme==='light'));
  }

  btnIgnite.addEventListener('click',function(){
    Sfx.ensure();
    if(state==='idle') ignite();
    else if(state==='burning') finish('manual');
    else ignite();
  });
  modesBox.addEventListener('click',function(e){
    var b=e.target.closest('.pill');
    if(!b||state==='burning') return;
    modeIdx=b.dataset.i|0;
    prefs.modeIdx=modeIdx;
    sessionLen=MODES[modeIdx].sec;
    refreshPills(); save(true);
  });
  btnSound.addEventListener('click',function(){
    prefs.sound=!prefs.sound;
    Sfx.ensure(); refreshSound();
    if(prefs.sound){ if(state==='burning') Sfx.startAmbient(); }
    else Sfx.stopAmbient();
    save(true);
  });
  btnBreath.addEventListener('click',function(){
    prefs.breath=!prefs.breath;
    breathT=0; refreshBreath(); save(true);
  });
  btnTheme.addEventListener('click',function(){
    prefs.theme=(prefs.theme==='dark'?'light':'dark');
    refreshTheme(); save(true);
  });
  $('#btnAgain').addEventListener('click',function(){
    overlay.classList.remove('open'); ignite();
  });
  $('#btnClose').addEventListener('click',function(){
    overlay.classList.remove('open'); toIdle();
  });

  /* 指针：拨烟风场 */
  var lastMoveT=0;
  window.addEventListener('pointermove',function(e){
    var n=performance.now();
    var dtm=Math.max(1,n-lastMoveT)/1000;
    if(ptr.x>-9000){
      ptr.vx=ptr.vx*0.6+((e.clientX-ptr.x)/dtm)*0.4;
      ptr.vy=ptr.vy*0.6+((e.clientY-ptr.y)/dtm)*0.4;
    }
    ptr.x=e.clientX; ptr.y=e.clientY; lastMoveT=n;
  },{passive:true});
  document.addEventListener('pointerout',function(e){
    if(!e.relatedTarget){ ptr.x=-9999; ptr.y=-9999; ptr.vx=0; ptr.vy=0; }
  });

  /* 点按：阵风 + 烟雾爆发（控件区域除外） */
  document.addEventListener('pointerdown',function(e){
    Sfx.ensure();
    if(e.target.closest('button')||e.target.closest('.overlay')||e.target.closest('.dock')||e.target.closest('.tools')) return;
    var t=tipPos();
    var dx=t.x-e.clientX, dy=t.y-e.clientY;
    var d=Math.hypot(dx,dy)||1;
    wind.gustX+=dx/d*90;
    wind.gustY+=dy/d*90-30;
    if(state==='burning'){ spawnSmoke(6,true); if(!RM) spawnSparks(2); }
  },{passive:true});

  /* 点按香炉 / 线香：功德 +1 */
  $('#burner').addEventListener('pointerdown',function(e){
    if(state==='idle') return;
    addMerit(e.clientX,e.clientY);
  });
  incense.addEventListener('pointerdown',function(e){
    if(state==='idle') return;
    addMerit(e.clientX,e.clientY);
  });

  /* 键盘：空格/回车 = 点火或功德，Esc = 关闭浮层 */
  window.addEventListener('keydown',function(e){
    if(e.repeat) return;
    if(e.code==='Space'||e.code==='Enter'){
      if(e.target&&e.target.tagName==='BUTTON') return;
      e.preventDefault(); Sfx.ensure();
      if(state==='idle'||state==='done'){
        if(state==='done') overlay.classList.remove('open');
        ignite();
      }else{
        var b=$('#burner').getBoundingClientRect();
        addMerit(b.left+b.width/2,b.top+8);
      }
    }else if(e.code==='Escape'){
      overlay.classList.remove('open');
    }
  });

  /* ---------- 14. 初始化 ---------- */
  function init(){
    refreshTheme(); refreshSound(); refreshBreath(); refreshPills();
    hudTotalRefresh();
    hudTime.textContent='00:00';
    resize();
    incense.classList.add('unlit');
    window.addEventListener('resize',resize);
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){ save(true); } else { last=performance.now(); }
    });
    window.addEventListener('pagehide',function(){ save(true); });
    requestAnimationFrame(frame);
  }
  init();
})();
</script>
